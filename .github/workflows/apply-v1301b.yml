name: Apply v1302 feed swipe popout viewer
on:
  push:
    branches: [main]
    paths: ['.github/v1302.trigger']
permissions:
  contents: write
jobs:
  build:
    if: github.event.head_commit.message == 'Trigger v1302 build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply transform
        run: python .github/v1302_transform.py
      - name: Validate v1302
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, hashlib
          s=Path('index.html').read_text(encoding='utf-8')
          head=s[:5000]
          m=re.search(r'<meta\s+content="([^"]+)"\s+name="fc-build"\s*/?>',head,re.I)
          if not m or m.group(1) != 'v1302 · feed-swipe-popout-viewer':
              raise SystemExit(f'bad build meta: {m.group(1) if m else None}')
          required=[
              'FC_V1302_VALIDATION','feedCardsExposeNextChallenger:true',
              'fc-feed-popout-active-v1302','calc(100% - 42px)',
              'fcFeedPopV1302','FC_V1301_VALIDATION','fcNormalizeAudioTransportV1301',
              'FC_UPDATE_PARSER_SELFTEST_V1174','updateViaCache'
          ]
          for token in required:
              if token not in s: raise SystemExit(f'missing invariant: {token}')
          if "fcOpenImmersiveViewerV1198('feed-viewer')" not in s:
              raise SystemExit('feed viewer scroll/depth guard was removed')
          if "document.body.classList.add('fc-feed-popout-active-v1302')" not in s:
              raise SystemExit('feed popout open state missing')
          if "document.body.classList.remove('fc-feed-popout-active-v1302')" not in s:
              raise SystemExit('feed popout close state missing')
          # Feed card width override must come after the v1082 100% override.
          if s.rfind('calc(100% - 42px)') < s.find('id="fc-v1082-uniform-entry-preview-css"'):
              raise SystemExit('feed peek override does not win cascade')
          scripts=re.findall(r'<script\b(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.I|re.S)
          with tempfile.TemporaryDirectory() as d:
              for i,code in enumerate(scripts,1):
                  f=Path(d)/f's{i}.js'; f.write_text(code,encoding='utf-8')
                  r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
                  if r.returncode:
                      print(r.stderr); raise SystemExit(f'inline JS {i} failed')
          styles=re.findall(r'<style\b[^>]*>(.*?)</style>',s,re.I|re.S)
          def ok(css):
              depth=0;i=0;quote=None;comment=False;esc=False
              while i<len(css):
                  c=css[i];n=css[i+1] if i+1<len(css) else ''
                  if comment:
                      if c=='*' and n=='/': comment=False;i+=2;continue
                      i+=1;continue
                  if quote:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==quote: quote=None
                      i+=1;continue
                  if c=='/' and n=='*': comment=True;i+=2;continue
                  if c in ('"',"'"): quote=c;i+=1;continue
                  if c=='{': depth+=1
                  elif c=='}':
                      depth-=1
                      if depth<0:return False
                  i+=1
              return depth==0
          bad=[i for i,x in enumerate(styles,1) if not ok(x)]
          if bad: raise SystemExit(f'CSS brace failure: {bad}')
          print(f'validated {len(scripts)} inline JS blocks and {len(styles)} CSS blocks')
          print('sha256',hashlib.sha256(Path('index.html').read_bytes()).hexdigest())
          PY
      - name: Commit v1302
        run: |
          git config user.name 'FlamesChallenge Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Build v1302 feed swipe popout viewer'
          git push
