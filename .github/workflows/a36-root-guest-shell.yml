name: A3.6 real staged root guest-shell phone smoke
on:
  push:
    branches: [a36-integration-v1389]
    paths: ['.github/workflows/a36-root-guest-shell.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staged-root-guest:
    if: github.ref == 'refs/heads/a36-integration-v1389'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated pinned browser harness
        run: npm install --prefix /tmp/fc-a36-shell --no-audit --no-fund playwright@1.56.1
      - name: Browser smoke on exact staged index.html (logged out, remote writes blocked)
        run: node devtools/a36_real_shell_smoke.js
      - name: Upload screenshots and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a36-real-root-v1394-guest-screens
          path: a36-real-shell-evidence/
          if-no-files-found: warn
          retention-days: 7
