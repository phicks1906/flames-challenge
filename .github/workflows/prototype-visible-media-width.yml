name: Prototype immersive media visible-width regression

on:
  push:
    branches:
      - 'prototype/iphone-review-20261121'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visible-media-width:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
      - name: Check real rendered pixels at both edges
        run: node preview/tests/immersive-media-width.test.mjs
      - name: Check browse-first entry window and compact disclaimer
        run: node preview/tests/entering-browse-first.test.mjs
