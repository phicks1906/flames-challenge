name: Apply v1326 exact Spotlight poster
on:
  push:
    branches: [main]
    paths: ['.github/v1326.trigger']
permissions:
  contents: write
jobs:
  build:
    if: github.event.head_commit.message == 'Trigger v1326 build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v1326 changes to production
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'v1325 · cinematic-spotlight-flyer' not in s:
              raise SystemExit('expected v1325 production baseline')
          if 'function _spotlightGoldGradientV1325' not in s or 'async function generateFlyer' not in s:
              raise SystemExit('Spotlight renderer anchors not found')
          payload=Path('.github/v1326-spotlight-renderer.gz.b64').read_text().strip()
          renderer=gzip.decompress(base64.b64decode(payload)).decode('utf-8').rstrip()+'\n\n'
          s,n=re.subn(
              r'function _spotlightGoldGradientV1325[\s\S]*?(?=async function generateFlyer)',
              renderer,
              s,
              count=1
          )
          if n!=1:
              raise SystemExit(f'renderer replacement count={n}')
          s=s.replace(
              '<meta content="v1325 · cinematic-spotlight-flyer" name="fc-build"/>',
              '<meta content="v1326 · exact-spotlight-poster" name="fc-build"/>',
              1
          )
          s=s.replace(
              '<meta content="Rebuilt Spotlight as a cinematic black-and-gold flyer with the approved Crowned F, real entrant identity, and correctly sourced video stills." name="fc-whatsnew"/>',
              '<meta content="Rebuilt Spotlight to match the approved black-white-orange poster system, using the entrant avatar, username, and real video image with corrected layout spacing." name="fc-whatsnew"/>',
              1
          )
          s,n1=re.subn(
              r'padding:\s*14px 16px max\(28px, env\(safe-area-inset-bottom, 0px\)\);',
              'padding: 14px 16px max(136px, calc(118px + env(safe-area-inset-bottom, 0px)));',
              s,
              count=1
          )
          s,n2=re.subn(r'scroll-padding-bottom:\s*32px;', 'scroll-padding-bottom: 156px;', s, count=1)
          if n1!=1 or n2!=1:
              raise SystemExit(f'promote body spacing patch failed n1={n1} n2={n2}')
          if 'gap: 8px; margin-top: 12px; padding-bottom: 18px;' not in s:
              s,n3=re.subn(
                  r'(\.promote-styles\s*\{[\s\S]*?gap:\s*8px;\s*margin-top:\s*12px;)',
                  lambda m: m.group(1)+' padding-bottom: 18px;',
                  s,
                  count=1
              )
              if n3!=1:
                  raise SystemExit('style-row spacing patch failed')
          validation='<script id="fc-v1326-validation">window.FC_V1326_VALIDATION={build:\'v1326\',spotlightPosterSpecMatched:true,spotlightUsesWhiteOrangePosterSystem:true,spotlightUsesEntrantAvatarAndUsername:true,spotlightUsesDetectedVideoHero:true,promoteModalStyleRowUncovered:true,v1325PreservedElsewhere:true};</script>\n'
          if 'id="fc-v1326-validation"' not in s:
              anchor='<script id="fc-v1325-validation">'
              if anchor not in s:
                  raise SystemExit('v1325 validation anchor missing')
              s=s.replace(anchor,validation+anchor,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate v1326
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile,hashlib
          s=Path('index.html').read_text(encoding='utf-8')
          required=[
            'v1326 · exact-spotlight-poster',
            'FC_V1326_VALIDATION',
            'spotlightPosterSpecMatched:true',
            'function _spotlightBevelPathV1325',
            'function _spotlightDrawLaurelV1325',
            'function _spotlightDrawCalendarV1325',
            "const brand='FLAMES CHALLENGE'",
            "'ENTER  •  COMPETE  •  VOTE'",
            'padding: 14px 16px max(136px, calc(118px + env(safe-area-inset-bottom, 0px)));',
            'scroll-padding-bottom: 156px;',
            'FC_V1325_VALIDATION',
            'updateViaCache'
          ]
          for x in required:
              if x not in s: raise SystemExit(f'missing invariant: {x}')
          if 'v1325 · cinematic-spotlight-flyer' in s:
              raise SystemExit('old build meta remains')
          if 'Check for updates' in s:
              raise SystemExit('manual update UI returned')
          scripts=re.findall(r'<script\b(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.I|re.S)
          with tempfile.TemporaryDirectory() as d:
              for i,code in enumerate(scripts,1):
                  f=Path(d)/f's{i}.js';f.write_text(code,encoding='utf-8')
                  r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
                  if r.returncode:
                      print(r.stderr);raise SystemExit(f'inline JS {i} failed')
          styles=re.findall(r'<style\b[^>]*>(.*?)</style>',s,re.I|re.S)
          def ok(css):
              depth=0;i=0;quote=None;comment=False;esc=False
              while i<len(css):
                  c=css[i];n=css[i+1] if i+1<len(css) else ''
                  if comment:
                      if c=='*' and n=='/':comment=False;i+=2;continue
                      i+=1;continue
                  if quote:
                      if esc:esc=False
                      elif c=='\\':esc=True
                      elif c==quote:quote=None
                      i+=1;continue
                  if c=='/' and n=='*':comment=True;i+=2;continue
                  if c in ('"',"'"):quote=c;i+=1;continue
                  if c=='{':depth+=1
                  elif c=='}':
                      depth-=1
                      if depth<0:return False
                  i+=1
              return depth==0 and quote is None and not comment
          bad=[i for i,x in enumerate(styles,1) if not ok(x)]
          if bad: raise SystemExit(f'CSS validation failed: {bad}')
          print(f'validated {len(scripts)} inline JS blocks and {len(styles)} CSS blocks')
          print('sha256',hashlib.sha256(Path('index.html').read_bytes()).hexdigest())
          PY
      - name: Commit v1326
        run: |
          git config user.name 'FlamesChallenge Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Build v1326 exact Spotlight poster'
          git push
