name: Apply v1335 exact production build
on:
  push:
    branches: [main]
    paths: ['.github/v1335.trigger']
permissions:
  contents: write
jobs:
  build:
    if: github.event.head_commit.message == 'Trigger v1335 build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact v1334 baseline
        run: |
          test "$(git hash-object index.html)" = "4dd132640206be234cf99850fd0f1c0a5bd91def"
          grep -Fq 'v1334 · spotlight-badge-count-fit' index.html
      - name: Apply exact final v1335 manifest
        run: |
          python .github/v1335_apply.py
          test "$(git hash-object index.html)" = "ffb16b853da27b2fbb5166b223516dbb997ed4b6"
      - name: Validate exact v1335
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile,hashlib,concurrent.futures
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          if 'v1335 · new-spotlight-template' not in s[:10000]:
              raise SystemExit('bad v1335 build meta')
          required=[
            'FC_V1335_VALIDATION','newSpotlightTemplate1024x1536:true',
            'whoWillWinMasthead:true','simplifiedSpotlightFooter:true',
            'isolatedEntriesBadge:true','dynamicHeroAndEntrantPreserved:true',
            'spotlightInlineFeedVideoPreserved:true','otherFlyerStylesPreserved:true',
            'peopleYouFollowExplanationRemoved:true','automaticUpdaterPreserved:true',
            'updateViaCache','fcPlayFlyerVideoV1332','playInlineV1239'
          ]
          for x in required:
              if x not in s: raise SystemExit('missing invariant: '+x)
          if 'Orange rings mean someone you follow is competing now. Tap their photo to view the challenge or vote.' in s:
              raise SystemExit('People You Follow explanation returned')
          if 'Check for updates' in s:
              raise SystemExit('manual update UI returned')
          scripts=re.findall(r'<script\b(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.I|re.S)
          with tempfile.TemporaryDirectory() as d:
              files=[]
              for i,code in enumerate(scripts,1):
                  f=Path(d)/f's{i}.js'; f.write_text(code,encoding='utf-8'); files.append((i,str(f)))
              def check(item):
                  i,f=item
                  r=subprocess.run(['node','--check',f],capture_output=True,text=True)
                  return i,r.returncode,r.stderr
              with concurrent.futures.ThreadPoolExecutor(max_workers=24) as ex:
                  results=list(ex.map(check,files))
              bad=[x for x in results if x[1]!=0]
              if bad:
                  print(bad[0][2]); raise SystemExit(f'inline JS {bad[0][0]} failed')
          styles=re.findall(r'<style\b[^>]*>(.*?)</style>',s,re.I|re.S)
          def ok(css):
              depth=0;i=0;quote=None;comment=False;esc=False
              while i<len(css):
                  c=css[i];n=css[i+1] if i+1<len(css) else ''
                  if comment:
                      if c=='*' and n=='/': comment=False;i+=2;continue
                      i+=1;continue
                  if quote:
                      if esc:esc=False
                      elif c=='\\':esc=True
                      elif c==quote:quote=None
                      i+=1;continue
                  if c=='/' and n=='*':comment=True;i+=2;continue
                  if c in ('"',"'"):quote=c;i+=1;continue
                  if c=='{':depth+=1
                  elif c=='}':
                      depth-=1
                      if depth<0:return False
                  i+=1
              return depth==0 and quote is None and not comment
          bad=[i for i,x in enumerate(styles,1) if not ok(x)]
          if bad: raise SystemExit(f'CSS validation failed: {bad}')
          if len(scripts)!=140 or len(styles)!=147:
              raise SystemExit(f'unexpected block counts: js={len(scripts)} css={len(styles)}')
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          if digest!='f35ae49930c0895e4c61cb8178f5ff74c86094184e7faec921aad8521ef1faf2':
              raise SystemExit('sha256 mismatch: '+digest)
          if len(p.read_bytes())!=4442583:
              raise SystemExit('byte length mismatch')
          print(f'validated {len(scripts)} JS and {len(styles)} CSS blocks')
          print('sha256',digest)
          PY
      - name: Commit v1335 and restore helper
        run: |
          git config user.name 'FlamesChallenge Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/v1335.trigger
          git show 11f1a3c8d422d865ae6669b50b76b53c0e7753f7:.github/workflows/apply-v1326.yml > .github/workflows/apply-v1326.yml
          git add index.html .github/workflows/apply-v1326.yml
          git commit -m 'Build v1335 new Spotlight template'
          git push
