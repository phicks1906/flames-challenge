name: Apply v1299 closed results carousel
on:
  push:
    branches: [main]
    paths: ['.github/v1299.trigger']
permissions:
  contents: write
jobs:
  build:
    if: github.event.head_commit.message == 'Trigger v1299 build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply transform
        run: python .github/v1299_transform.py
      - name: Validate v1299
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('index.html').read_text(encoding='utf-8')
          head=s[:4096]
          m=re.search(r'<meta\s+content="([^"]+)"\s+name="fc-build"\s*/?>',head,re.I)
          if not m or m.group(1) != 'v1299 · closed-results-carousel-restored':
              raise SystemExit(f'bad build meta: {m.group(1) if m else None}')
          for token in ['FC_V1299_VALIDATION','MATCHUP ENTRIES · SWIPE TO REVIEW','renderFvEntry(e, ch, false, myVoteEntryId, status)','data-fv-result-entry','FC_V1298_VALIDATION']:
              if token not in s: raise SystemExit(f'missing invariant: {token}')
          if "list.innerHTML = '';\n      list.style.display = 'none';" in s:
              raise SystemExit('closed results still hide entry carousel')
          scripts=re.findall(r'<script\b(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.I|re.S)
          with tempfile.TemporaryDirectory() as d:
              for i,code in enumerate(scripts,1):
                  f=Path(d)/f's{i}.js'; f.write_text(code,encoding='utf-8')
                  r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
                  if r.returncode:
                      print(r.stderr); raise SystemExit(f'inline JS {i} failed')
          styles=re.findall(r'<style\b[^>]*>(.*?)</style>',s,re.I|re.S)
          def ok(css):
              depth=0;i=0;quote=None;comment=False;esc=False
              while i<len(css):
                  c=css[i];n=css[i+1] if i+1<len(css) else ''
                  if comment:
                      if c=='*' and n=='/': comment=False;i+=2;continue
                      i+=1;continue
                  if quote:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==quote: quote=None
                      i+=1;continue
                  if c=='/' and n=='*': comment=True;i+=2;continue
                  if c in ('"',"'"): quote=c;i+=1;continue
                  if c=='{': depth+=1
                  elif c=='}':
                      depth-=1
                      if depth<0:return False
                  i+=1
              return depth==0
          bad=[i for i,x in enumerate(styles,1) if not ok(x)]
          if bad: raise SystemExit(f'CSS brace failure: {bad}')
          print(f'validated {len(scripts)} inline JS blocks and {len(styles)} CSS blocks')
          PY
          sha256sum index.html
      - name: Commit v1299
        run: |
          git config user.name 'FlamesChallenge Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Build v1299 restore post-result entry carousel'
          git push
