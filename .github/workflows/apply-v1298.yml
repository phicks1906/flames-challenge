name: Apply v1298 final results redesign
on:
  push:
    branches: [main]
    paths: ['.github/v1298.trigger']
permissions:
  contents: write
jobs:
  build:
    if: github.event.head_commit.message == 'Trigger v1298 build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply transform
        run: python .github/v1298_transform.py
      - name: Validate inline JS, CSS, version, and updater invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, sys
          s=Path('index.html').read_text(encoding='utf-8')
          head=s[:4096]
          meta=re.search(r'<meta\s+content="([^"]+)"\s+name="fc-build"\s*/?>',head,re.I)
          if not meta or meta.group(1) != 'v1298 · unmistakable-final-results-and-entry-access':
              raise SystemExit(f'bad primary fc-build meta: {meta.group(1) if meta else None}')
          for token in ['_readMetaContentV1174','FC_UPDATE_PARSER_SELFTEST_V1174','FC_V1297_VALIDATION','FC_V1298_VALIDATION','data-fv-result-entry','Challenge Complete','View Full Details']:
              if token not in s: raise SystemExit(f'missing invariant: {token}')
          if "s3 = 'live'; cd3 = 'Decided'" in s:
              raise SystemExit('closed journey still marks Winner live')
          scripts=re.findall(r'<script\b(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.I|re.S)
          with tempfile.TemporaryDirectory() as d:
              for i,code in enumerate(scripts,1):
                  f=Path(d)/f's{i}.js'; f.write_text(code,encoding='utf-8')
                  r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
                  if r.returncode:
                      print(r.stderr); raise SystemExit(f'inline JS {i} failed')
          styles=re.findall(r'<style\b[^>]*>(.*?)</style>',s,re.I|re.S)
          def ok(css):
              depth=0;i=0;quote=None;comment=False;esc=False
              while i<len(css):
                  c=css[i];n=css[i+1] if i+1<len(css) else ''
                  if comment:
                      if c=='*' and n=='/': comment=False;i+=2;continue
                      i+=1;continue
                  if quote:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==quote: quote=None
                      i+=1;continue
                  if c=='/' and n=='*': comment=True;i+=2;continue
                  if c in ('"',"'"): quote=c;i+=1;continue
                  if c=='{': depth+=1
                  elif c=='}':
                      depth-=1
                      if depth<0:return False
                  i+=1
              return depth==0
          bad=[i for i,x in enumerate(styles,1) if not ok(x)]
          if bad: raise SystemExit(f'CSS brace failure: {bad}')
          print(f'validated {len(scripts)} inline JS blocks and {len(styles)} CSS blocks')
          PY
      - name: Upload v1298 index
        uses: actions/upload-artifact@v4
        with:
          name: flameschallenge-v1298
          path: index.html
          if-no-files-found: error
      - name: Commit v1298
        run: |
          git config user.name 'FlamesChallenge Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Build v1298 unmistakable final results and entry access'
          git push
