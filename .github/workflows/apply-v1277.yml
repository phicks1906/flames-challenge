name: Apply v1277 audio mock
on:
  push:
    branches: [main]
    paths: ['.github/v1277-trigger.txt']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Reconstruct and apply exact v1277 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/v1277_payload_*.txt | tr -d '\n' | base64 -d | gunzip > /tmp/v1277.patch
          git apply --check /tmp/v1277.patch
          git apply /tmp/v1277.patch
          test "$(sha256sum index.html | awk '{print $1}')" = "8f8c57881d7b10ebfa559cacf86b686451ca078980a6028efbad45f0239ef8bf"
          grep -q 'v1277 · approved-audio-mock-match' index.html
      - name: Commit exact v1277 and remove temporary updater
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/v1277.patch.template .github/v1277_payload_*.txt .github/v1277-trigger.txt .github/workflows/apply-v1277.yml
          git config user.name "FlamesChallenge Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Build v1277 approved audio mock"
          git push origin HEAD:main
