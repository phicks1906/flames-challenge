name: A3.6 v1400 Following modal hides and restores primary nav
on:
  push:
    branches: [a36-integration-v1389]
    paths: ['.github/workflows/a36-v1400-following-runtime.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage-following-nav-runtime:
    if: github.ref == 'refs/heads/a36-integration-v1389'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install standalone parser
        run: npm install --prefix /tmp/fc-a36-css --no-audit --no-fund postcss@8.5.6
      - name: Validate v1399 source
        run: python3 devtools/fc_source_tools.py validate
      - name: Apply isolated Following nav runtime fix to staged app
        run: python3 devtools/a36_following_nav_runtime_patch_v1400.py
      - name: Run JS and CSS validation with A3.6 regressions
        run: |
          python3 devtools/fc_source_tools.py validate
          node devtools/a36_css_parse_test.js
          node --check devtools/a36_following_nav_runtime_v1400_test.js
          node devtools/a36_following_nav_runtime_v1400_test.js
          node devtools/a36_following_nav_v1399_test.js
          node devtools/a36_get_app_gate_v1398_test.js
          node devtools/a36_ember_gate_v1397_test.js
          node devtools/a36_guidelines_gate_v1396_test.js
          node devtools/a36_competing_label_test.js
          node devtools/a36_follow_independent_test.js
          node devtools/a36_avatar_authoritative_test.js
          node devtools/a36_part1_test.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          s=Path('index.html').read_text('utf8')
          assert s.count('v1400 · a36-following-nav-runtime')==1
          assert s.count('function fcA36SyncFollowingNavV1400()')==1
          assert subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()==['index.html']
          print('PASS v1400: only staging root index.html modified; no production, SQL or service worker')
          PY
      - name: Commit verified staged v1400 candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git commit -m 'v1400 candidate: restore primary nav visibility when Following sheet closes'
          git push origin HEAD:refs/heads/a36-integration-v1389
