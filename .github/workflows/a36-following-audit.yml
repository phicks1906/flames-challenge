name: A3.6 Part 3 Following source audit
on:
  push:
    branches: [a36-integration-v1389]
    paths: ['.github/workflows/a36-following-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect existing Following implementation, read-only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          source=p.read_text(encoding='utf-8')
          lines=source.splitlines()
          patterns={
            'following_tokens':r'\bfollowing\b|\bfollowers\b|\bfollows\b|followUser|toggleFollow|isFollowing|followed_user|followedUser',
            'navigation':r'psState|renderProfileTab|renderProfileSheet|data-pstab',
            'vote_confirmation':r'vote.*confirm|confirm.*vote|voteReceipt|vote.*success|castVote',
          }
          print('SOURCE',len(source),'chars',len(lines),'lines')
          print('FC_BUILD',re.findall(r'<meta[^>]+name="fc-build"[^>]+>',source)[:2])
          for key,pat in patterns.items():
            matches=[(i+1,l.strip()[:220]) for i,l in enumerate(lines) if re.search(pat,l,re.I)]
            print('SECTION',key,'TOTAL',len(matches))
            for line,text in matches[:95 if key=='following_tokens' else 22]:
              print(f'{line}: {text}')
          print('SELECTED_CONTEXT')
          for i,line in enumerate(lines):
            if re.search(r'(?:from\([\'"](?:follows|user_follows|followers|following)[\'"]\)|function\s+\w*[Ff]ollow|(?:const|let)\s+\w*[Ff]ollow\w*\s*=)',line):
              print('---',i+1)
              for j in range(max(0,i-3),min(len(lines),i+9)):
                print(f'{j+1}: {lines[j][:260]}')
          PY
