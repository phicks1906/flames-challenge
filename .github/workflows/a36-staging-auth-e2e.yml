name: A3.6 real staging authenticated journey
on:
  push:
    branches: [a36-integration-v1389]
    paths: ['.github/workflows/a36-staging-auth-e2e.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authenticated-staging:
    if: github.ref == 'refs/heads/a36-integration-v1389' && vars.FC_A36_STAGING_E2E_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      FC_A36_TEST_EMAIL: ${{ secrets.FC_A36_TEST_EMAIL }}
      FC_A36_TEST_PASSWORD: ${{ secrets.FC_A36_TEST_PASSWORD }}
      FC_A36_STAGING_URL: https://pcmobielrhdfzivrwvuu.supabase.co
      FC_A36_STAGING_PUBLISHABLE_KEY: sb_publishable_CEKUcsp6qLL3RL5iajJ5jg_ArDJB7BK
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify supported staging Auth sign-in harness
        run: node --check devtools/a36_staging_auth_e2e.js
      - name: Exercise real staging login with private test-account credentials
        run: node devtools/a36_staging_auth_e2e.js
