name: Apply v1308 feed-only challenge flow
on:
  push:
    branches: [main]
    paths: ['.github/v1308b.trigger']
permissions:
  contents: write
jobs:
  build:
    if: github.event.head_commit.message == 'Trigger v1308 fallback build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Verify v1307 baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,re
          p=Path('index.html');s=p.read_text()
          m=re.search(r'<meta\s+content="([^"]+)"\s+name="fc-build"',s[:5000],re.I)
          if not m or m.group(1)!='v1307 · live-media-motion': raise SystemExit(f'bad baseline: {m.group(1) if m else None}')
          d=hashlib.sha256(p.read_bytes()).hexdigest()
          if d!='350f5757bbc21e3b59033c1960baa4ee70233dfce7b49255434f85162bcf4d4c': raise SystemExit(d)
          PY
      - name: Apply v1308 patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip
          Path('/tmp/v1308.patch').write_bytes(gzip.decompress(base64.b64decode(Path('.github/v1308.patch.gz.b64').read_text().strip())))
          PY
          git apply --check /tmp/v1308.patch
          git apply /tmp/v1308.patch
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate v1308
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile,hashlib
          p=Path('index.html');s=p.read_text()
          if 'v1308 · feed-only-challenge-flow' not in s[:5000]: raise SystemExit('bad version')
          for t in ['FC_V1308_VALIDATION','homeChallengeStaysOnFeed:true','competeChallengeUsesSameOverlay:true','championshipNoLongerEscapesToDetail:true','feedViewerDetailsInline:true','FC_V1307_VALIDATION','FC_V1306_VALIDATION','FC_V1305_VALIDATION','updateViaCache']:
              if t not in s: raise SystemExit('missing '+t)
          a=s[s.index('function fcOpenChallengeSurfaceV1273'):s.index('function runChallengeCardAction')]
          if 'openChallenge(' in a: raise SystemExit('surface escape remains')
          b=s[s.index('function openFeedViewerChallenge()'):s.index('function promoteFeedViewerChallenge()')]
          if 'openChallenge(' in b: raise SystemExit('footer escape remains')
          scripts=re.findall(r'<script\b(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.I|re.S)
          with tempfile.TemporaryDirectory() as d:
              for i,code in enumerate(scripts,1):
                  f=Path(d)/f'{i}.js';f.write_text(code)
                  r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
                  if r.returncode: print(r.stderr);raise SystemExit(f'JS {i}')
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          if digest!='7e54644afab805f5c2c4e14b53a34cb2bfa7ad89968ec75c709ddc6e3182ba17': raise SystemExit(digest)
          print('validated',len(scripts),'scripts',digest)
          PY
      - name: Commit v1308
        run: |
          git config user.name 'FlamesChallenge Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Build v1308 feed-only challenge flow'
          git push
