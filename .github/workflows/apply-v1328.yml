name: Apply v1328 matched Spotlight hero and footer
on:
  push:
    branches: [main]
    paths: ['.github/v1328.trigger']
permissions:
  contents: write
jobs:
  build:
    if: github.event.head_commit.message == 'Trigger v1328 build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact v1327 production baseline
        run: |
          test "$(git hash-object index.html)" = "9a094d2d0de013602b2507f5c5a2465b254dc878"
          grep -Fq 'v1327 · measured-spotlight-poster' index.html
      - name: Apply exact v1328 patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip
          payload=Path('.github/v1328.patch.gz.b64').read_text().strip()
          Path('/tmp/v1328.patch').write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          git apply --whitespace=nowarn /tmp/v1328.patch
          test "$(git hash-object index.html)" = "1d7b4db7dc24e926d0608201ca9adb8bf91d8823"
      - name: Validate v1328
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile,hashlib
          s=Path('index.html').read_text(encoding='utf-8')
          required=[
            'v1328 · matched-spotlight-hero-footer',
            'FC_V1328_VALIDATION',
            'updateViaCache',
            'cv.width=1122',
            'cv.height=1402',
            "stateRefV1184.spotlightHeroAutoUrlV1325 || stateRefV1184.heroAutoUrl",
            '_spotlightReadVideoDurationV1328',
            '_spotlightDrawFooterEmblemV1328',
            'padding: 14px 16px max(136px, calc(118px + env(safe-area-inset-bottom, 0px)));',
            'scroll-padding-bottom: 156px;'
          ]
          for x in required:
              if x not in s: raise SystemExit(f'missing invariant: {x}')
          if 'v1327 · measured-spotlight-poster' in s: raise SystemExit('v1327 build meta remains')
          if 'Check for updates' in s: raise SystemExit('manual update UI returned')
          scripts=re.findall(r'<script\b(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.I|re.S)
          with tempfile.TemporaryDirectory() as d:
              for i,code in enumerate(scripts,1):
                  f=Path(d)/f's{i}.js';f.write_text(code,encoding='utf-8')
                  r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
                  if r.returncode:
                      print(r.stderr);raise SystemExit(f'inline JS {i} failed')
          styles=re.findall(r'<style\b[^>]*>(.*?)</style>',s,re.I|re.S)
          def ok(css):
              depth=0;i=0;quote=None;comment=False;esc=False
              while i<len(css):
                  c=css[i];n=css[i+1] if i+1<len(css) else ''
                  if comment:
                      if c=='*' and n=='/':comment=False;i+=2;continue
                      i+=1;continue
                  if quote:
                      if esc:esc=False
                      elif c=='\\':esc=True
                      elif c==quote:quote=None
                      i+=1;continue
                  if c=='/' and n=='*':comment=True;i+=2;continue
                  if c in ('"',"'"):quote=c;i+=1;continue
                  if c=='{':depth+=1
                  elif c=='}':
                      depth-=1
                      if depth<0:return False
                  i+=1
              return depth==0 and quote is None and not comment
          bad=[i for i,x in enumerate(styles,1) if not ok(x)]
          if bad: raise SystemExit(f'CSS validation failed: {bad}')
          digest=hashlib.sha256(Path('index.html').read_bytes()).hexdigest()
          if digest!='3b9eb21daa18f5678be7efa4c42affce887dbf2423730bcb912a79ff54179f69':
              raise SystemExit('output sha256 mismatch: '+digest)
          print(f'validated {len(scripts)} inline JS blocks and {len(styles)} CSS blocks')
          print('sha256',digest)
          PY
      - name: Commit v1328
        run: |
          git config user.name 'FlamesChallenge Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/v1328.patch.gz.b64 .github/workflows/apply-v1328.yml .github/v1328.trigger
          git add index.html
          git commit -m 'Build v1328 matched Spotlight hero and footer'
          git push