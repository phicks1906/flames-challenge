name: Apply v1314 Home Compete parity
on:
  push:
    branches: [main]
    paths: ['.github/v1314.trigger']
permissions:
  contents: write
jobs:
  build:
    if: github.event.head_commit.message == 'Trigger v1314 build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify v1313 baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          m=re.search(r'<meta\s+content="([^"]+)"\s+name="fc-build"\s*/?>',s[:7000],re.I)
          if not m or m.group(1)!='v1313 · smooth-carousel-height':
              raise SystemExit(f'expected v1313 baseline, found {m.group(1) if m else None}')
          d=hashlib.sha256(p.read_bytes()).hexdigest()
          if d!='a0bd44d52adbab45db42089587f1e8ac96204c2bc32ff2cbad8d4f318052ece2':
              raise SystemExit(f'baseline hash mismatch: {d}')
          print('baseline OK',d)
          PY
      - name: Apply exact v1314 patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip
          data=Path('.github/v1314.patch.gz.b64').read_text().strip()
          Path('/tmp/v1314.patch').write_bytes(gzip.decompress(base64.b64decode(data)))
          PY
          git apply --check /tmp/v1314.patch
          git apply /tmp/v1314.patch
      - name: Validate v1314
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile,hashlib
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          m=re.findall(r'<meta\s+content="([^"]+)"\s+name="fc-build"\s*/?>',s[:7000],re.I)
          if m!=['v1314 · home-compete-parity']:
              raise SystemExit(f'bad build meta: {m}')
          required=[
            'FC_V1314_VALIDATION',
            'homeUsesCompeteChallengeShell:true',
            'homeClosedCardsUseCompeteFinalShell:true',
            'homeKeepsViewResultEnterChallengeBar:true',
            'homeAndCompeteFullFillMediaPreserved:true',
            'reverseSwipeResistanceReduced:true',
            'railHeightFrozenDuringGesture:true',
            'FC_V1313_VALIDATION',
            'FC_V1312_VALIDATION',
            'FC_V1311_VALIDATION',
            'FC_V1310_VALIDATION',
            'const CAP_S = 3;',
            'updateViaCache'
          ]
          for t in required:
              if t not in s: raise SystemExit(f'missing invariant: {t}')
          if "buildChallengeCardShell(ch,'feed')" in s:
              raise SystemExit('Home still uses old feed-specific shell')
          if "item.kind === 'challenge' || item.kind === 'winner'" not in s:
              raise SystemExit('closed Home challenge wiring missing')
          if "const ch = { ...challenge, computedStatus: 'closed' };" not in s:
              raise SystemExit('closed Home challenge parity missing')
          if 'Check for updates' in s:
              raise SystemExit('manual update UI returned')
          scripts=re.findall(r'<script\b(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.I|re.S)
          with tempfile.TemporaryDirectory() as d:
              for i,code in enumerate(scripts,1):
                  f=Path(d)/f's{i}.js'; f.write_text(code,encoding='utf-8')
                  r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
                  if r.returncode:
                      print(r.stderr); raise SystemExit(f'inline JS {i} failed')
          styles=re.findall(r'<style\b[^>]*>(.*?)</style>',s,re.I|re.S)
          def ok(css):
              depth=0;i=0;quote=None;comment=False;esc=False
              while i<len(css):
                  c=css[i]; n=css[i+1] if i+1<len(css) else ''
                  if comment:
                      if c=='*' and n=='/': comment=False;i+=2;continue
                      i+=1;continue
                  if quote:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==quote: quote=None
                      i+=1;continue
                  if c=='/' and n=='*': comment=True;i+=2;continue
                  if c in ('"',"'"): quote=c;i+=1;continue
                  if c=='{': depth+=1
                  elif c=='}':
                      depth-=1
                      if depth<0:return False
                  i+=1
              return depth==0 and quote is None and not comment
          bad=[i for i,x in enumerate(styles,1) if not ok(x)]
          if bad: raise SystemExit(f'CSS brace failure: {bad}')
          d=hashlib.sha256(p.read_bytes()).hexdigest()
          if d!='a3a504521810ba17340a41d0423b0e8a4696e8b03ddee6805453755a76a8faf9':
              raise SystemExit(f'output hash mismatch: {d}')
          print(f'validated {len(scripts)} inline JS blocks and {len(styles)} CSS blocks')
          print('sha256',d)
          PY
      - name: Commit v1314
        run: |
          git config user.name 'FlamesChallenge Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Build v1314 Home Compete parity'
          git push
