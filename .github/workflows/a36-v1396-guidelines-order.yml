name: A3.6 v1396 Guidelines before optional guide
on:
  push:
    branches: [a36-integration-v1389]
    paths: ['.github/workflows/a36-v1396-guidelines-order.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  guarded-staging-release-candidate:
    if: github.ref == 'refs/heads/a36-integration-v1389'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify intact v1395 staging baseline
        run: python3 devtools/fc_source_tools.py validate
      - name: Apply safely scoped Guidelines-first staged patch
        run: python3 devtools/a36_fix_guidelines_guide_v1396.py
      - name: Validate v1396 and prior A3.6 behavior
        run: |
          python3 devtools/fc_source_tools.py validate
          node devtools/a36_guidelines_gate_v1396_test.js
          node devtools/a36_competing_label_test.js
          node devtools/a36_follow_independent_test.js
          node devtools/a36_avatar_authoritative_test.js
          node devtools/a36_part1_test.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          s=Path('index.html').read_text(encoding='utf-8')
          assert s.count('v1396 · a36-guidelines-before-welcome-guide')==1
          assert s.count("window.fcMaybeOpenOptionalGuideV1103 = function()")==1
          assert subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()==['index.html']
          print('PASS only staging root index.html changed. No database, SW, or production edits.')
          PY
      - name: Commit validated staging-only v1396 candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git commit -m 'v1396 candidate: wait for Guidelines acknowledgement before welcome guide'
          git push origin HEAD:refs/heads/a36-integration-v1389
