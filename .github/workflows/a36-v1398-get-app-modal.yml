name: A3.6 v1398 Get App prompt respects Ember native dialog
on:
  push:
    branches: [a36-integration-v1389]
    paths: ['.github/workflows/a36-v1398-get-app-modal.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  staging-only-get-app-fix:
    if: github.ref == 'refs/heads/a36-integration-v1389'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate intact staged v1397 baseline
        run: python3 devtools/fc_source_tools.py validate
      - name: Apply guarded Get App native dialog coordination
        run: python3 devtools/a36_fix_get_app_prompt_v1398.py
      - name: Run v1398 gate and all earlier A3.6 regressions
        run: |
          python3 devtools/fc_source_tools.py validate
          node --check devtools/a36_get_app_gate_v1398_test.js
          node devtools/a36_get_app_gate_v1398_test.js
          node devtools/a36_ember_gate_v1397_test.js
          node devtools/a36_guidelines_gate_v1396_test.js
          node devtools/a36_competing_label_test.js
          node devtools/a36_follow_independent_test.js
          node devtools/a36_avatar_authoritative_test.js
          node devtools/a36_part1_test.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          s=Path('index.html').read_text('utf8')
          assert s.count('v1398 · a36-safe-get-app-after-ember')==1
          assert s.count('dailyEmberV1398.addEventListener(')==1
          assert subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()==['index.html']
          print('PASS: only staging root index.html modified; no production, SQL or service worker changes')
          PY
      - name: Commit tested v1398 to staging only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git commit -m 'v1398 candidate: defer Get App prompt until native Ember is closed'
          git push origin HEAD:refs/heads/a36-integration-v1389
