name: Apply v1279 compact audio geometry
on:
  push:
    branches: [main]
    paths: ['.github/v1279-trigger.txt']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply v1279 deterministic transform
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<meta content="v1278 · compact-live-audio-swipe-fix" name="fc-build"/>'
          new='<meta content="v1279 · compact-audio-final-geometry" name="fc-build"/>'
          if s.count(old)!=1: raise SystemExit(f'build meta count {s.count(old)}')
          s=s.replace(old,new,1)
          old2='<meta content="Corrected the premium audio player: compact 16:9 geometry without stretching, truly live waveform animation, single time display, reliable swipe-to-next with playback stop, and the same premium treatment on winner cards." name="fc-whatsnew"/>'
          new2='<meta content="Locked audio cards to the intended compact 16:9 size on every Home/Compete path, removed the wasted lower area and remaining baked-control bleed-through, and kept winner audio at the same compact geometry." name="fc-whatsnew"/>'
          if s.count(old2)!=1: raise SystemExit(f'whatsnew count {s.count(old2)}')
          s=s.replace(old2,new2,1)
          style='''\n<style id="fc-v1279-audio-compact-final">\n/* v1279 — final geometry guard. v1278's 16:9 rule could still lose on Home\n   when the generic v1202 4:5 selector had greater/equal cascade weight.\n   Target the actual premium media node at the end of the document so audio\n   can never inherit the photo/video stage again. */\n.fc-entry-rail-v1079 .fc-entry-stage-fixed-v1202 > .fcc-entry-media.fc-audio-premium-v1277,\n.fc-entry-rail-v1079 .fcc-entry-card .fcc-entry-media.fc-audio-premium-v1277,\n.fc-winner-audio-v1123 .fcc-entry-media.fc-audio-premium-v1277,\n.fc-winner-audio-v1123 .fc-audio-premium-v1277 {\n  width:100%!important;\n  height:auto!important;\n  min-height:0!important;\n  max-height:none!important;\n  aspect-ratio:16 / 9!important;\n}\n/* Keep the cinematic art sharp, use the top 16:9 crop, then fully suppress\n   the old baked controls in the lower band. The live player owns that space. */\n.fc-audio-premium-v1277 .fc-audio-premium-art-v1277 {\n  width:100%!important;\n  height:100%!important;\n  min-height:0!important;\n  aspect-ratio:auto!important;\n  background-size:100% auto!important;\n  background-position:center top!important;\n}\n.fc-audio-premium-v1277 .fc-audio-premium-art-v1277::after {\n  top:57%!important;\n  background:linear-gradient(180deg,rgba(5,3,2,.26) 0%,rgba(5,3,2,.90) 22%,rgba(5,3,2,.985) 100%)!important;\n}\n/* Resting waveform stays visible, then becomes fully reactive during play. */\n.fc-audio-premium-v1277 .fc-audio-premium-live-v1277 {\n  top:72%!important;\n  height:14%!important;\n  opacity:.46!important;\n}\n.fc-audio-premium-v1277.playing .fc-audio-premium-live-v1277 {opacity:.98!important}\n.fc-audio-premium-v1277 .fcc-audio-btn {\n  top:59%!important;\n  width:12.5%!important;\n  min-width:54px!important;\n  min-height:54px!important;\n  max-width:72px!important;\n  max-height:72px!important;\n}\n.fc-audio-premium-v1277 .fc-audio-premium-time-v1277 {\n  bottom:4.5%!important;\n  height:28px!important;\n  min-height:28px!important;\n  min-width:58px!important;\n  padding:0 9px!important;\n  border-radius:11px!important;\n}\n/* Audio cards should not reserve a photo-stage-sized shell around the player. */\n.fc-entry-rail-v1079 .fcc-entry-card:has(> .fcc-entry-media.fc-audio-premium-v1277) {\n  min-height:0!important;\n  height:auto!important;\n}\n</style>\n<script>window.FC_V1279_VALIDATION={build:"v1279",audio169FinalCascade:true,noPhotoStageInheritance:true,bakedControlsMasked:true,restingWaveVisible:true,winnerAudioSameGeometry:true,v1278SwipeFixPreserved:true,updateParserPreserved:true};</script>\n'''
          if 'id="fc-v1279-audio-compact-final"' in s: raise SystemExit('v1279 style already present')
          if '</body>' not in s: raise SystemExit('body marker missing')
          s=s.replace('</body>',style+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          test "$(sha256sum index.html | awk '{print $1}')" = "99123031af85a706520969d55b68e9e31bcfd60a01622f6a3e6fd3f3a8019bbe"
      - name: Validate inline JavaScript and CSS
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess,tempfile,os,sys
          html=Path('index.html').read_text(encoding='utf-8')
          class P(HTMLParser):
            def __init__(self):
              super().__init__(convert_charrefs=False); self.scripts=[]; self.styles=[]; self._tag=None; self._buf=[]; self._src=False
            def handle_starttag(self,tag,attrs):
              if tag=='script': self._tag='script'; self._buf=[]; self._src=any(k=='src' for k,v in attrs)
              elif tag=='style': self._tag='style'; self._buf=[]; self._src=False
            def handle_data(self,data):
              if self._tag in ('script','style'): self._buf.append(data)
            def handle_endtag(self,tag):
              if tag==self._tag:
                text=''.join(self._buf)
                if tag=='script' and not self._src and text.strip(): self.scripts.append(text)
                if tag=='style': self.styles.append(text)
                self._tag=None; self._buf=[]; self._src=False
          p=P(); p.feed(html)
          for i,code in enumerate(p.scripts):
            f=tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8'); f.write(code); f.close()
            r=subprocess.run(['node','--check',f.name],stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True)
            os.unlink(f.name)
            if r.returncode: print(f'inline script {i} failed'); print(r.stderr); sys.exit(1)
          def balanced(css):
            depth=0;i=0;quote=None;comment=False
            while i<len(css):
              c=css[i]; n=css[i+1] if i+1<len(css) else ''
              if comment:
                if c=='*' and n=='/': comment=False;i+=2;continue
                i+=1;continue
              if quote:
                if c=='\\':i+=2;continue
                if c==quote:quote=None
                i+=1;continue
              if c=='/' and n=='*':comment=True;i+=2;continue
              if c in ('"',"'"):quote=c;i+=1;continue
              if c=='{':depth+=1
              elif c=='}':
                depth-=1
                if depth<0:return False
              i+=1
            return depth==0
          for i,css in enumerate(p.styles):
            if not balanced(css): print(f'style block {i} failed'); sys.exit(2)
          print(f'validated {len(p.scripts)} inline scripts and {len(p.styles)} style blocks')
          PY
          grep -q 'function _readMetaContentV1174' index.html
          grep -q 'FC_UPDATE_PARSER_SELFTEST_V1174' index.html
      - name: Commit v1279 and clean temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/v1279-trigger.txt .github/workflows/apply-v1279.yml
          git config user.name "FlamesChallenge Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Build v1279 compact audio final geometry"
          git push origin HEAD:main
