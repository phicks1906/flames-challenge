name: Apply v1287 retire Waveform audio style
on:
  push:
    branches: [main]
    paths: ['.github/v1287-trigger.txt']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply v1287 transform
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "4d98f05f75abc76ca76fe2d4623f9ab002e600ab"
          python3 .github/v1287_transform.py
          test "$(git hash-object index.html)" = "efdb7229a51112d4dd8e3327cbdaa98ce5032984"
          grep -q 'v1287 · waveform-style-retired' index.html
          grep -q "const EQ_STYLES = \['scene', 'vinyl', 'flame'\]" index.html
          ! grep -q "style === 'waveform'" index.html
      - name: Validate inline JavaScript and CSS
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess,tempfile,os,sys
          html=Path('index.html').read_text(encoding='utf-8')
          class P(HTMLParser):
            def __init__(self): super().__init__(convert_charrefs=False); self.scripts=[]; self.styles=[]; self.tag=None; self.buf=[]; self.src=False
            def handle_starttag(self,t,a):
              if t=='script': self.tag='script'; self.buf=[]; self.src=any(k=='src' for k,v in a)
              elif t=='style': self.tag='style'; self.buf=[]; self.src=False
            def handle_data(self,d):
              if self.tag in ('script','style'): self.buf.append(d)
            def handle_endtag(self,t):
              if t==self.tag:
                x=''.join(self.buf)
                if t=='script' and not self.src and x.strip(): self.scripts.append(x)
                elif t=='style': self.styles.append(x)
                self.tag=None; self.buf=[]; self.src=False
          p=P();p.feed(html)
          for i,c in enumerate(p.scripts):
            f=tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8');f.write(c);f.close()
            r=subprocess.run(['node','--check',f.name],capture_output=True,text=True);os.unlink(f.name)
            if r.returncode: print(f'inline script {i} failed'); print(r.stderr); sys.exit(1)
          def balanced(css):
            depth=0;i=0;q=None;comment=False
            while i<len(css):
              c=css[i];n=css[i+1] if i+1<len(css) else ''
              if comment:
                if c=='*' and n=='/': comment=False;i+=2;continue
                i+=1;continue
              if q:
                if c=='\\': i+=2;continue
                if c==q:q=None
                i+=1;continue
              if c=='/' and n=='*':comment=True;i+=2;continue
              if c in ('"',"'"):q=c;i+=1;continue
              if c=='{':depth+=1
              elif c=='}':
                depth-=1
                if depth<0:return False
              i+=1
            return depth==0
          for i,c in enumerate(p.styles):
            if not balanced(c): print(f'style block {i} failed'); sys.exit(2)
          print(f'validated {len(p.scripts)} inline scripts and {len(p.styles)} style blocks')
          PY
          grep -q 'function _readMetaContentV1174' index.html
          grep -q 'FC_UPDATE_PARSER_SELFTEST_V1174' index.html
          grep -q 'fcPauseEntryCardMediaV1278' index.html
          grep -q 'FC_V1286_VALIDATION' index.html
          grep -q 'FC_V1287_VALIDATION' index.html
      - name: Package deployable file
        uses: actions/upload-artifact@v4
        with:
          name: v1287-index
          path: index.html
          retention-days: 1
      - name: Commit v1287 and clean staging
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/v1287-trigger.txt .github/v1287_transform.py .github/workflows/apply-v1287.yml
          git config user.name "FlamesChallenge Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Build v1287 retire redundant Waveform audio style"
          git push origin HEAD:main
