name: FlamesChallenge targeted source tools
on:
  push:
    branches:
      - a36-integration-v1389
    paths:
      - 'devtools/**'
      - '.github/workflows/fc-targeted-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate source map without uploading the HTML
        run: python3 devtools/fc_source_tools.py map
      - name: Bounded A3.6 source probe
        run: python3 devtools/fc_probe.py --max-matches 8 --before 4 --after 9
      - name: A3.6 Following source audit (read-only)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          lines=Path('index.html').read_text(encoding='utf-8').splitlines()
          patterns={
           'following':r'\\bfollowing\\b|\\bfollowers\\b|\\bfollows\\b|followUser|toggleFollow|isFollowing|followed_user|followedUser',
           'profile':r'psState|renderProfileTab|renderProfileSheet',
          }
          for section,pat in patterns.items():
           matches=[(i+1,x.strip()[:190]) for i,x in enumerate(lines) if re.search(pat,x,re.I)]
           print('SECTION',section,'TOTAL',len(matches))
           for line,text in matches[:95 if section=='following' else 15]:
            print(f'{line}: {text}')
          for i,line in enumerate(lines):
           if re.search(r'from\\([\\x27\\x22](?:follows|user_follows|followers|following)[\\x27\\x22]\\)|function\\s+\\w*[Ff]ollow',line):
            print('CONTEXT',i+1)
            for j in range(max(0,i-2),min(len(lines),i+8)):
             print(f'{j+1}: {lines[j][:230]}')
          PY
      - name: A3.6 Part 3 exact Following anchors
        run: python3 devtools/a36_follow_probe.py
      - name: A3.6 real You Votes Following navigation anchors
        run: python3 devtools/a36_flow_anchors_probe.py
      - name: Check guarded patch runner (dry run only)
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          first=s[:min(len(s),120)]
          if not first:
              raise SystemExit("Empty production source")
          anchor=first[:min(len(first), 30)]
          if s.count(anchor)!=1:
              raise SystemExit("Self-test anchor is ambiguous")
          Path("/tmp/fc-patch-test.json").write_text(
              json.dumps({"edits":[{"old":anchor,"new":anchor+" "}]})
          )
          PY
          python3 devtools/fc_source_tools.py patch /tmp/fc-patch-test.json
          git diff --exit-code -- index.html
      - name: Verify staged app backend host (read-only, no keys)
        run: python3 devtools/a36_backend_target_audit.py
      - name: Identify exact backend configuration anchors with secrets redacted
        run: python3 devtools/a36_redacted_backend_config_probe.py
      - name: Check inline JS and invariant metadata
        run: python3 devtools/fc_source_tools.py validate
      - name: A3.6 Part 1 isolated behavior checks
        run: node devtools/a36_part1_test.js
      - name: Upload small source map and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fc-source-map
          path: .fc-tools/source-map.json
          if-no-files-found: ignore
          retention-days: 7
