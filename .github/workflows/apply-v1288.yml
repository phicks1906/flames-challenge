name: Apply v1288 moderation status entry recovery
on:
  push:
    branches: [main]
    paths: ['.github/v1288-trigger.txt']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply v1288 patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "efdb7229a51112d4dd8e3327cbdaa98ce5032984"
          cat .github/v1288_patch_0.txt .github/v1288_patch_1.txt .github/v1288_patch_2.txt .github/v1288_patch_3.txt .github/v1288_patch_4.txt > /tmp/v1288.patch
          git apply --check /tmp/v1288.patch
          git apply /tmp/v1288.patch
          test "$(sha256sum index.html | awk '{print $1}')" = "c0125a35bd9b8f278a593805e733d95018b21240eb3059efa8ebc3de149de8a1"
          test "$(git hash-object index.html)" = "8cc3912b884dfe7b0b1cec20e7079e053ee3c370"
      - name: Validate inline JavaScript and CSS
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess,tempfile,os,sys
          html=Path('index.html').read_text(encoding='utf-8')
          class P(HTMLParser):
            def __init__(self):
              super().__init__(convert_charrefs=False); self.scripts=[]; self.styles=[]; self.tag=None; self.buf=[]; self.src=False
            def handle_starttag(self,tag,attrs):
              if tag=='script': self.tag='script'; self.buf=[]; self.src=any(k=='src' for k,v in attrs)
              elif tag=='style': self.tag='style'; self.buf=[]; self.src=False
            def handle_data(self,d):
              if self.tag in ('script','style'): self.buf.append(d)
            def handle_endtag(self,tag):
              if tag==self.tag:
                text=''.join(self.buf)
                if tag=='script' and not self.src and text.strip(): self.scripts.append(text)
                elif tag=='style': self.styles.append(text)
                self.tag=None; self.buf=[]; self.src=False
          p=P(); p.feed(html)
          for i,code in enumerate(p.scripts):
            f=tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8'); f.write(code); f.close()
            r=subprocess.run(['node','--check',f.name],capture_output=True,text=True); os.unlink(f.name)
            if r.returncode:
              print(f'inline script {i} failed'); print(r.stderr); sys.exit(1)
          def balanced(css):
            depth=0;i=0;quote=None;comment=False
            while i<len(css):
              c=css[i]; n=css[i+1] if i+1<len(css) else ''
              if comment:
                if c=='*' and n=='/': comment=False; i+=2; continue
                i+=1; continue
              if quote:
                if c=='\\': i+=2; continue
                if c==quote: quote=None
                i+=1; continue
              if c=='/' and n=='*': comment=True; i+=2; continue
              if c in ('"',"'"): quote=c; i+=1; continue
              if c=='{': depth+=1
              elif c=='}':
                depth-=1
                if depth<0: return False
              i+=1
            return depth==0
          for i,css in enumerate(p.styles):
            if not balanced(css): print(f'style block {i} failed'); sys.exit(2)
          print(f'validated {len(p.scripts)} inline scripts and {len(p.styles)} style blocks')
          PY
          grep -q 'v1288 · moderation-status-entry-recovery' index.html
          grep -q 'function fcRefreshOwnEntryForChallengeV1288' index.html
          grep -q 'Replace rejected entry' index.html
          grep -q 'Video under review' index.html
          grep -q 'replacementVideoRerunsModeration:true' index.html
          grep -q 'function _readMetaContentV1174' index.html
          grep -q 'FC_UPDATE_PARSER_SELFTEST_V1174' index.html
          grep -q 'waveformStyleRetired:true' index.html
      - name: Commit v1288 and clean staging
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/v1288_patch_*.txt .github/v1288-trigger.txt .github/workflows/apply-v1288.yml
          git config user.name "FlamesChallenge Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Build v1288 moderation status entry recovery"
          git push origin HEAD:main
