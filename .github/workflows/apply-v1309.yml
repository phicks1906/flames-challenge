name: Apply v1309 voting focus cleanup
on:
  push:
    branches: [main]
    paths: ['.github/v1309.trigger']
permissions:
  contents: write
jobs:
  build:
    if: github.event.head_commit.message == 'Trigger v1309 build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify v1308 production baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          m=re.search(r'<meta\s+content="([^"]+)"\s+name="fc-build"\s*/?>',s[:7000],re.I)
          if not m or m.group(1)!='v1308 · feed-only-challenge-flow':
              raise SystemExit(f'expected v1308 baseline, found {m.group(1) if m else None}')
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          expected='7e54644afab805f5c2c4e14b53a34cb2bfa7ad89968ec75c709ddc6e3182ba17'
          if digest!=expected:
              raise SystemExit(f'baseline hash mismatch: {digest}')
          print('baseline OK',digest)
          PY
      - name: Apply exact v1309 patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip
          data=Path('.github/v1309.patch.gz.b64').read_text().strip()
          Path('/tmp/v1309.patch').write_bytes(gzip.decompress(base64.b64decode(data)))
          PY
          git apply --check /tmp/v1309.patch
          git apply /tmp/v1309.patch
      - name: Validate v1309
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile,hashlib
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          m=re.findall(r'<meta\s+content="([^"]+)"\s+name="fc-build"\s*/?>',s[:7000],re.I)
          if m!=['v1309 · voting-focus-cleanup']:
              raise SystemExit(f'bad build meta: {m}')
          required=[
            'FC_V1309_VALIDATION',
            'votingDirectionsRemoved:true',
            'challengeRulesCollapsedToLink:true',
            'askEmberCollapsedToLink:true',
            'scorePendingBadgeHiddenDuringVoting:true',
            'redundantLiveRaceCardRemoved:true',
            'voteRecordedNoticeCompact:true',
            'voteDismissXPreserved:true',
            'entryMediaMovedUp:true',
            'feedViewerVotingChromeCompact:true',
            'v1308FeedOnlyRoutingPreserved:true',
            'FC_V1308_VALIDATION','FC_V1307_VALIDATION','FC_V1306_VALIDATION',
            'FC_V1305_VALIDATION','FC_UPDATE_PARSER_SELFTEST_V1174','updateViaCache',
            'const CAP_S = 3;'
          ]
          for token in required:
              if token not in s:
                  raise SystemExit(f'missing invariant: {token}')
          if 'Check for updates' in s:
              raise SystemExit('manual update UI returned')
          surface=s[s.index('function fcOpenChallengeSurfaceV1273'):s.index('function runChallengeCardAction')]
          if 'openChallenge(' in surface or 'openFeedViewer(chId, startEntryId)' not in surface:
              raise SystemExit('v1308 feed-only challenge routing regressed')
          footer=s[s.index('function openFeedViewerChallenge()'):s.index('function promoteFeedViewerChallenge()')]
          if 'openChallenge(' in footer or 'toggleFvChallengeDetailsV1308' not in footer:
              raise SystemExit('v1308 overlay details routing regressed')
          if "document.getElementById('fcV1025LiveRace')?.remove()" not in s:
              raise SystemExit('live-race cleanup missing')
          if "header.textContent='Vote'" not in s:
              raise SystemExit('compact voting header missing')
          scripts=re.findall(r'<script\b(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.I|re.S)
          with tempfile.TemporaryDirectory() as d:
              for i,code in enumerate(scripts,1):
                  f=Path(d)/f's{i}.js'; f.write_text(code,encoding='utf-8')
                  r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
                  if r.returncode:
                      print(r.stderr)
                      raise SystemExit(f'inline JS {i} failed')
          styles=re.findall(r'<style\b[^>]*>(.*?)</style>',s,re.I|re.S)
          def ok(css):
              depth=0;i=0;quote=None;comment=False;esc=False
              while i<len(css):
                  c=css[i];n=css[i+1] if i+1<len(css) else ''
                  if comment:
                      if c=='*' and n=='/': comment=False;i+=2;continue
                      i+=1;continue
                  if quote:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==quote: quote=None
                      i+=1;continue
                  if c=='/' and n=='*': comment=True;i+=2;continue
                  if c in ('"',"'"): quote=c;i+=1;continue
                  if c=='{': depth+=1
                  elif c=='}':
                      depth-=1
                      if depth<0:return False
                  i+=1
              return depth==0 and quote is None and not comment
          bad=[i for i,x in enumerate(styles,1) if not ok(x)]
          if bad:
              raise SystemExit(f'CSS brace failure: {bad}')
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          expected='d8c0518d5970e2477a0d85193465de951f0155a25a371ae869268239bbae7ebf'
          if digest!=expected:
              raise SystemExit(f'output hash mismatch: {digest}')
          print(f'validated {len(scripts)} inline JS blocks and {len(styles)} CSS blocks')
          print('sha256',digest)
          PY
      - name: Commit v1309
        run: |
          git config user.name 'FlamesChallenge Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Build v1309 voting focus cleanup'
          git push
