name: A3.6 v1394 truthful Competing now staging fix
on:
  push:
    branches: [a36-integration-v1389]
    paths: ['.github/workflows/a36-v1394-competing-label.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage-label-fix:
    if: github.ref == 'refs/heads/a36-integration-v1389'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source and baseline tests
        run: python3 devtools/fc_source_tools.py validate
      - name: Apply guarded active-only label fix to staging
        run: python3 devtools/a36_fix_competing_label_v1394.py
      - name: Verify labeling, Following, official results and unchanged production
        run: |
          python3 devtools/fc_source_tools.py validate
          node --check devtools/a36_competing_label_test.js
          node --check devtools/a36_follow_independent_test.js
          node devtools/a36_competing_label_test.js
          node devtools/a36_follow_independent_test.js
          node devtools/a36_part1_test.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          s=Path('index.html').read_text(encoding='utf-8')
          assert s.count('v1394 · a36-following-active-only')==1
          assert s.count("renderFollowList(list, orderedProfiles, activeIds, 'following');")==1
          assert s.count("renderFollowList(list, profiles, new Set(), 'following');")==1
          assert s.count('await fcA36AttachFollowingEntriesV1391(list, profiles);')==1
          assert subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()==['index.html']
          print('PASS: only staged index.html modified; production, RLS and databases unchanged.')
          PY
      - name: Commit verified v1394 staging candidate, never production
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git commit -m 'v1394 candidate: show Competing now only for verified active followed entries'
          git push origin HEAD:refs/heads/a36-integration-v1389
