name: A3.6 GitHub Pages hosting status
on:
  push:
    branches: [gh-pages]
    paths:
      - '.github/workflows/a36-pages-status.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read Pages configuration without changing it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, urllib.request, urllib.error, json
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/pages'
          req=urllib.request.Request(url,headers={
            'Authorization':'Bearer '+os.environ['GH_TOKEN'],
            'Accept':'application/vnd.github+json',
            'User-Agent':'a36-staging-status'
          })
          try:
            with urllib.request.urlopen(req,timeout=20) as resp:
              data=json.load(resp)
              print('PAGES_STATUS=EXISTS')
              print('URL='+str(data.get('html_url')))
              print('SOURCE='+str(data.get('source')))
              print('BUILD_TYPE='+str(data.get('build_type')))
              print('CUSTOM_DOMAIN_SET='+str(bool(data.get('cname'))))
          except urllib.error.HTTPError as e:
            print('PAGES_HTTP_STATUS='+str(e.code))
            if e.code not in (404,403): raise
          PY
