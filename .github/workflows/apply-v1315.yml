name: Apply v1315 poll revote clean refresh
on:
  push:
    branches: [main]
    paths: ['.github/v1315.trigger']
permissions:
  contents: write
jobs:
  build:
    if: github.event.head_commit.message == 'Trigger v1315 build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify v1314 baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          m=re.search(r'<meta\s+content="([^"]+)"\s+name="fc-build"\s*/?>',s[:7000],re.I)
          if not m or m.group(1)!='v1314 · home-compete-parity':
              raise SystemExit(f'expected v1314 baseline, found {m.group(1) if m else None}')
          d=hashlib.sha256(p.read_bytes()).hexdigest()
          if d!='a3a504521810ba17340a41d0423b0e8a4696e8b03ddee6805453755a76a8faf9':
              raise SystemExit(f'baseline hash mismatch: {d}')
          print('baseline OK',d)
          PY
      - name: Apply exact v1315 patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip
          data=Path('.github/v1315.patch.gz.b64').read_text().strip()
          Path('/tmp/v1315.patch').write_bytes(gzip.decompress(base64.b64decode(data)))
          PY
          git apply --check /tmp/v1315.patch
          git apply /tmp/v1315.patch
      - name: Validate v1315
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile,hashlib
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          m=re.findall(r'<meta\s+content="([^"]+)"\s+name="fc-build"\s*/?>',s[:7000],re.I)
          if m!=['v1315 · poll-revote-clean-refresh']:
              raise SystemExit(f'bad build meta: {m}')
          required=[
            'FC_V1315_VALIDATION',
            'pollRevoteUntilClose:true',
            'pollVoteUsesUpsert:true',
            'pollCountsMoveInsteadOfDuplicate:true',
            'pollPageOptionsRemainInteractiveAfterVote:true',
            'feedPollOptionsRemainInteractiveAfterVote:true',
            'replacedFeedPollRewired:true',
            'closedPollsRemainLocked:true',
            'misleadingIdlePullArrowRemoved:true',
            'pullRefreshGesturePreserved:true',
            'v1314HomeCompeteParityPreserved:true',
            "db.from('votes').upsert",
            "onConflict: 'poll_id,user_id'",
            'wireFeedPollCardV1315',
            'FC_V1314_VALIDATION',
            'updateViaCache'
          ]
          for t in required:
              if t not in s: raise SystemExit(f'missing invariant: {t}')
          cast=s[s.index('async function castVote(pollId, optionIdx) {'):s.index('function injectPollTopAnswer')]
          if "state.myVotes[pollId] !== undefined) return" in cast:
              raise SystemExit('old no-revote guard remains')
          if "db.from('votes').insert" in cast:
              raise SystemExit('old insert-only poll vote remains')
          if '#fcPullRefreshV1282{display:none!important}' not in s:
              raise SystemExit('idle pull-refresh indicator not hidden')
          if 'Check for updates' in s:
              raise SystemExit('manual update UI returned')
          scripts=re.findall(r'<script\b(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.I|re.S)
          with tempfile.TemporaryDirectory() as d:
              for i,code in enumerate(scripts,1):
                  f=Path(d)/f's{i}.js'; f.write_text(code,encoding='utf-8')
                  r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
                  if r.returncode:
                      print(r.stderr); raise SystemExit(f'inline JS {i} failed')
          styles=re.findall(r'<style\b[^>]*>(.*?)</style>',s,re.I|re.S)
          def ok(css):
              depth=0;i=0;quote=None;comment=False;esc=False
              while i<len(css):
                  c=css[i]; n=css[i+1] if i+1<len(css) else ''
                  if comment:
                      if c=='*' and n=='/': comment=False;i+=2;continue
                      i+=1;continue
                  if quote:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==quote: quote=None
                      i+=1;continue
                  if c=='/' and n=='*': comment=True;i+=2;continue
                  if c in ('"',"'"): quote=c;i+=1;continue
                  if c=='{': depth+=1
                  elif c=='}':
                      depth-=1
                      if depth<0:return False
                  i+=1
              return depth==0 and quote is None and not comment
          bad=[i for i,x in enumerate(styles,1) if not ok(x)]
          if bad: raise SystemExit(f'CSS brace failure: {bad}')
          d=hashlib.sha256(p.read_bytes()).hexdigest()
          if d!='84b5460277cd4cd463051a33e86531f289ed443e2c5a3f6b974d0de04ed5e45d':
              raise SystemExit(f'output hash mismatch: {d}')
          print(f'validated {len(scripts)} inline JS blocks and {len(styles)} CSS blocks')
          print('sha256',d)
          PY
      - name: Commit v1315
        run: |
          git config user.name 'FlamesChallenge Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Build v1315 poll revote clean refresh'
          git push
