name: Apply v1289 Ember context and Scene reveal
on:
  push:
    branches: [main]
    paths: ['.github/v1289-trigger.txt']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply v1289 patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "8cc3912b884dfe7b0b1cec20e7079e053ee3c370"
          git apply --check .github/v1289.patch
          git apply .github/v1289.patch
          test "$(git hash-object index.html)" = "d5814dd577b321e21c9bc2df6ba0063db60ce191"
          test "$(sha256sum index.html | awk '{print $1}')" = "393d11e4575222f29445707323abc52bff9b1ff2f277f6041b06960f60117fac"
      - name: Validate inline JavaScript and CSS
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess,tempfile,os,sys
          html=Path('index.html').read_text(encoding='utf-8')
          class P(HTMLParser):
            def __init__(self): super().__init__(convert_charrefs=False); self.scripts=[]; self.styles=[]; self.tag=None; self.buf=[]; self.src=False
            def handle_starttag(self,tag,attrs):
              if tag=='script': self.tag='script'; self.buf=[]; self.src=any(k=='src' for k,v in attrs)
              elif tag=='style': self.tag='style'; self.buf=[]; self.src=False
            def handle_data(self,d):
              if self.tag in ('script','style'): self.buf.append(d)
            def handle_endtag(self,tag):
              if tag==self.tag:
                text=''.join(self.buf)
                if tag=='script' and not self.src and text.strip(): self.scripts.append(text)
                elif tag=='style': self.styles.append(text)
                self.tag=None; self.buf=[]; self.src=False
          p=P();p.feed(html)
          for i,code in enumerate(p.scripts):
            f=tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8');f.write(code);f.close()
            r=subprocess.run(['node','--check',f.name],capture_output=True,text=True);os.unlink(f.name)
            if r.returncode: print(f'inline script {i} failed');print(r.stderr);sys.exit(1)
          def balanced(css):
            depth=0;i=0;quote=None;comment=False
            while i<len(css):
              c=css[i];n=css[i+1] if i+1<len(css) else ''
              if comment:
                if c=='*' and n=='/':comment=False;i+=2;continue
                i+=1;continue
              if quote:
                if c=='\\':i+=2;continue
                if c==quote:quote=None
                i+=1;continue
              if c=='/' and n=='*':comment=True;i+=2;continue
              if c in ('"',"'"):quote=c;i+=1;continue
              if c=='{':depth+=1
              elif c=='}':
                depth-=1
                if depth<0:return False
              i+=1
            return depth==0
          for i,css in enumerate(p.styles):
            if not balanced(css): print(f'style block {i} failed');sys.exit(2)
          print(f'validated {len(p.scripts)} inline scripts and {len(p.styles)} style blocks')
          PY
          grep -q 'v1289 · ember-competitor-context-and-scene-reveal' index.html
          grep -q 'FC_V1289_VALIDATION' index.html
          ! grep -q 'I’m using this challenge’s current status, deadlines, entries, and rules.' index.html
          ! grep -q 'Recorded rule:' index.html
          grep -q 'function _readMetaContentV1174' index.html
          grep -q 'FC_UPDATE_PARSER_SELFTEST_V1174' index.html
          grep -q 'FC_V1288_VALIDATION' index.html
      - name: Commit v1289 and clean staging
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/v1289.patch .github/v1289-trigger.txt .github/workflows/apply-v1289.yml
          git config user.name "FlamesChallenge Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Build v1289 Ember context and Scene reveal"
          git push origin HEAD:main
