name: A3.6 v1397 Ember native modal ordering
on:
  push:
    branches: [a36-integration-v1389]
    paths: ['.github/workflows/a36-v1397-ember-order.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  guarded-staging-fix:
    if: github.ref == 'refs/heads/a36-integration-v1389'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify staged v1396 candidate source
        run: python3 devtools/fc_source_tools.py validate
      - name: Apply scoped Ember native top-layer ordering fix
        run: python3 devtools/a36_fix_ember_onboarding_v1397.py
      - name: Test Ember gate and version-aware existing A3.6 regressions
        run: |
          python3 devtools/fc_source_tools.py validate
          node --check devtools/a36_ember_gate_v1397_test.js
          node devtools/a36_ember_gate_v1397_test.js
          node devtools/a36_guidelines_gate_v1396_test.js
          node devtools/a36_competing_label_test.js
          node devtools/a36_follow_independent_test.js
          node devtools/a36_avatar_authoritative_test.js
          node devtools/a36_part1_test.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          s=Path('index.html').read_text('utf8')
          assert s.count('v1397 · a36-ember-after-onboarding')==1
          assert s.count('function fcA36EmberMustDeferV1397()')==1
          assert subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()==['index.html']
          print('PASS only staging index.html changed; no production, schema, SW edits')
          PY
      - name: Commit tested v1397 to staging only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git commit -m 'v1397 candidate: defer native Ember until onboarding and Guidelines complete'
          git push origin HEAD:refs/heads/a36-integration-v1389
