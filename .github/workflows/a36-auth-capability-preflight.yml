name: A3.6 staging Auth capability preflight
on:
  push:
    branches: [a36-integration-v1389]
    paths: ['.github/workflows/a36-auth-capability-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth-preflight:
    if: github.ref == 'refs/heads/a36-integration-v1389'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      FC_A36_STAGING_URL: https://pcmobielrhdfzivrwvuu.supabase.co
      FC_A36_STAGING_PUBLISHABLE_KEY: sb_publishable_CEKUcsp6qLL3RL5iajJ5jg_ArDJB7BK
    steps:
      - uses: actions/checkout@v4
        with: 
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Auth settings probe
        run: node --check devtools/a36_auth_capabilities.js
      - name: Read staging Auth settings (no signup)
        run: node devtools/a36_auth_capabilities.js
