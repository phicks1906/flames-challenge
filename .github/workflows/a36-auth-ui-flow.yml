name: A3.6 real signed-in Votes Following mobile navigation
on:
  push:
    branches: [a36-integration-v1389]
    paths: ['.github/workflows/a36-auth-ui-flow.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging-mobile-ui-flow:
    if: github.ref == 'refs/heads/a36-integration-v1389'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      FC_A36_STAGING_PUBLISHABLE_KEY: sb_publishable_CEKUcsp6qLL3RL5iajJ5jg_ArDJB7BK
      FC_A36_TEST_EMAIL: ${{ secrets.FC_A36_TEST_EMAIL }}
      FC_A36_TEST_PASSWORD: ${{ secrets.FC_A36_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create ephemeral staging-connected application
        run: python3 devtools/a36_make_ephemeral_staging_preview.py
      - name: Install isolated pinned Playwright
        run: npm install --prefix /tmp/fc-a36-flow --no-audit --no-fund playwright@1.56.1
      - name: Complete required onboarding with preserved interests then test Votes Following
        run: |
          node --check devtools/a36_signed_in_ui_flow.js
          node devtools/a36_signed_in_ui_flow.js
      - name: Upload UI screenshots and redacted report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a36-v1395-signed-in-ui-flow
          path: a36-flow-ui-evidence/
          if-no-files-found: warn
          retention-days: 7
