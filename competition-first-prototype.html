<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090909"><title>FlamesChallenge · Competition-first exploration</title>
<style>:root{color-scheme:dark;--bg:#090909;--panel:#171717;--line:#303030;--text:#f8f8f8;--dim:#aaa;--orange:#ff6a2c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:2px solid #ffad7e}header{position:sticky;top:0;background:#090909f2;border-bottom:1px solid #222;z-index:3;padding:calc(env(safe-area-inset-top) + 13px) 18px 13px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:.06em;font-size:16px}.brand b{color:var(--orange)}.demo{font-size:10px;color:#bbb;border:1px solid #444;border-radius:20px;padding:5px 9px}main{max-width:680px;margin:auto;padding:21px 17px calc(110px + env(safe-area-inset-bottom))}h1{font-size:28px;letter-spacing:-.8px;margin:5px 0 7px}p{color:var(--dim);line-height:1.45}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.3px;color:#aaa;font-weight:800}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:23px 0 28px}.action{background:#1b1b1b;border:1px solid #393939;border-radius:16px;text-align:left;padding:15px 11px;min-height:112px}.action .symbol{display:block;font-size:26px;color:var(--orange);margin-bottom:10px}.action strong{display:block;font-size:17px}.action small{display:block;color:#aaa;font-size:11px;margin-top:5px}.action:active,.card:active{transform:scale(.99)}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:0 0 13px}.sectionhead h2{margin:0;font-size:20px}.link{border:0;background:none;color:#ff975f;font-weight:700;font-size:13px}.chips{display:flex;gap:7px;overflow:auto;margin:18px 0 16px;scrollbar-width:none}.chip{border:1px solid #454545;border-radius:50px;background:#171717;padding:10px 15px;white-space:nowrap;font-size:13px}.chip.active{background:#f6f6f6;color:#111;border-color:#fff;font-weight:800}.card{border:1px solid #383838;background:#151515;border-radius:17px;margin:12px 0;padding:15px;text-align:left;width:100%;display:block}.topline{display:flex;justify-content:space-between;align-items:center;gap:8px}.tag{font-size:10px;text-transform:uppercase;letter-spacing:.5px;font-weight:800;border-radius:5px;padding:6px 7px;background:#39312b;color:#ffb98d}.tag.vote{background:#2d2620;color:#ffae72}.tag.results{background:#2d2d2d;color:#ddd}.category{color:#a5a5a5;font-size:12px}.card h3{font-size:19px;margin:13px 0 4px}.card p{font-size:13px;margin:0 0 14px}.media{height:115px;display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:13px 0}.media div{display:grid;place-items:center;background:linear-gradient(135deg,#292929,#1b1b1b);border:1px solid #363636;border-radius:10px;color:#888;font-size:12px}.cta{background:var(--orange);color:#111;border:0;border-radius:10px;padding:12px 15px;font-weight:850;width:100%}.bottom{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #353535;padding:9px 5px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);z-index:5}.nav{border:0;background:transparent;color:#aaa;display:grid;justify-items:center;gap:4px;font-size:10px;padding:5px 0}.nav i{font-style:normal;font-size:22px}.nav.active{color:#ff965d}.overlay{position:fixed;inset:0;background:#000b;z-index:8;display:none;align-items:flex-end}.overlay.show{display:flex}.sheet{width:100%;max-width:680px;margin:auto;background:#181818;border:1px solid #444;border-radius:23px 23px 0 0;max-height:89dvh;overflow:auto;padding:18px 18px calc(30px + env(safe-area-inset-bottom))}.sheethead{display:flex;align-items:center;justify-content:space-between}.close{border:1px solid #555;border-radius:100%;width:37px;height:37px;background:#292929;font-size:22px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.choice{min-height:130px;border:1px solid #4c4c4c;border-radius:13px;background:#252525;text-align:center;padding:15px}.choice.selected{border:2px solid var(--orange)}.choice .art{font-size:32px;margin:17px}.notice{font-size:12px;color:#bbb;padding:12px;background:#262626;border-radius:9px;margin:13px 0}.hide{display:none!important}</style></head>
<body><header><span class="brand"><b>♛</b> FLAMESCHALLENGE</span><span class="demo">INTERACTIVE DEMO · SAMPLE DATA</span></header><main><div id="view"></div></main>
<nav class="bottom" id="nav"></nav><div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<script>
const items=[{id:1,title:"Street Photography",cat:"Photography",status:"vote",desc:"Two finalists. One winner.",a:"City lights",b:"Golden hour"},{id:2,title:"Best Original Verse",cat:"Music",status:"enter",desc:"Entries are being accepted.",a:"Performance",b:"Your entry"},{id:3,title:"Weekend Plate",cat:"Cooking",status:"results",desc:"The final result is in.",a:"Winning plate",b:"Runner-up"},{id:4,title:"Portrait Challenge",cat:"Art",status:"vote",desc:"Choose your favorite entry.",a:"Portrait A",b:"Portrait B"},{id:5,title:"The Big Finish",cat:"Fitness",status:"enter",desc:"Show your best finish.",a:"Athlete",b:"Your entry"}];
const statusText={enter:"Open for entries",vote:"Voting now",results:"Results available"},actionText={enter:"Enter challenge",vote:"Vote in challenge",results:"View results"};let tab="Home",filter="vote",selected=null,choice=null,done=new Set();const view=document.getElementById("view"),overlay=document.getElementById("overlay"),sheet=document.getElementById("sheet");const safe=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function card(x){return '<button class="card" data-open="'+x.id+'"><div class="topline"><span class="category">'+safe(x.cat)+'</span><span class="tag '+x.status+'">'+statusText[x.status]+'</span></div><h3>'+safe(x.title)+'</h3><p>'+safe(x.desc)+'</p><div class="media"><div>'+safe(x.a)+'</div><div>'+safe(x.b)+'</div></div><div class="cta">'+(done.has(x.id)?"View challenge":actionText[x.status])+' →</div></button>'}
function render(){let navs=[["Home","⌂"],["Compete","⚔"],["Create","＋"],["Titles","♛"],["You","◉"]];document.getElementById("nav").innerHTML=navs.map(([n,i])=>'<button class="nav '+(tab===n?"active":"")+'" data-tab="'+n+'"><i>'+i+'</i>'+n+'</button>').join("");if(tab==="Home"){view.innerHTML='<div class="eyebrow">Competition starts here</div><h1>Enter. Vote. Win.</h1><p>Find a competition, choose a winner, or see who earned the title.</p><div class="actions">'+[["enter","＋","Enter","Join a challenge"],["vote","◈","Vote","Pick a winner"],["results","♛","Results","See who won"]].map(([f,i,t,d])=>'<button class="action" data-filter="'+f+'"><span class="symbol">'+i+'</span><strong>'+t+'</strong><small>'+d+'</small></button>').join("")+'</div><div class="sectionhead"><h2>Happening now</h2><button class="link" data-all="vote">See all →</button></div>'+items.filter(x=>x.status!=="results").slice(0,3).map(card).join("")+'<div class="notice">Demo content illustrates navigation and interaction only. It is not connected to live competitions.</div>'}else if(tab==="Compete"){view.innerHTML='<div class="eyebrow">Competition browser</div><h1>Compete</h1><p>Choose what you want to do. Every challenge uses the same status and action.</p><div class="chips">'+[["enter","Enter"],["vote","Vote"],["results","Results"],["all","All"]].map(([f,t])=>'<button class="chip '+(filter===f?"active":"")+'" data-filter="'+f+'">'+t+'</button>').join("")+'</div>'+items.filter(x=>filter==="all"||x.status===filter).map(card).join("")}else{view.innerHTML='<div class="eyebrow">Existing destination retained</div><h1>'+tab+'</h1><p>This area is intentionally not redesigned in this navigation exploration. The production '+tab+' functionality must remain intact.</p><button class="cta" data-tab="Compete">Explore competitions →</button>'} }
function show(id){selected=items.find(x=>x.id===Number(id));choice=null;if(!selected)return;const x=selected;sheet.innerHTML='<div class="sheethead"><span class="tag '+x.status+'">'+statusText[x.status]+'</span><button class="close" id="close" aria-label="Close">×</button></div><h1>'+safe(x.title)+'</h1><p>'+safe(x.desc)+'</p><div class="choices"><button class="choice" data-choice="a"><div class="art">▧</div>'+safe(x.a)+'</button><button class="choice" data-choice="b"><div class="art">▧</div>'+safe(x.b)+'</button></div><div class="notice" id="info">'+(x.status==="vote"?"Select an entry, then cast your vote.":x.status==="enter"?"Entry submission would open the existing production submission flow.": "The winner and final standings would come from settled production results.")+'</div><button class="cta" id="confirm">'+(x.status==="vote"?"Select an entry to vote":x.status==="enter"?"Continue to entry":"View final standings")+'</button>';overlay.classList.add("show");document.body.style.overflow="hidden";document.getElementById("confirm").onclick=()=>{if(x.status==="vote"&&!choice)return;if(x.status==="vote"){done.add(x.id);document.getElementById("info").textContent="Demo vote recorded locally for this preview only. No live ballot was submitted."}else if(x.status==="enter"){document.getElementById("info").textContent="Prototype boundary: production entry form and uploads are not simulated."}else{document.getElementById("info").textContent="Sample result: City lights won. Production must use authoritative settled results."}document.getElementById("confirm").textContent="Close and return";document.getElementById("confirm").onclick=close;render()}}
function close(){overlay.classList.remove("show");document.body.style.overflow="";selected=null}document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;if(t.dataset.tab){tab=t.dataset.tab;render();window.scrollTo(0,0)}else if(t.dataset.filter){filter=t.dataset.filter;tab="Compete";render();window.scrollTo(0,0)}else if(t.dataset.all){filter=t.dataset.all;tab="Compete";render();window.scrollTo(0,0)}else if(t.dataset.open){show(t.dataset.open)}else if(t.id==="close"){close()}else if(t.dataset.choice){choice=t.dataset.choice;sheet.querySelectorAll(".choice").forEach(n=>n.classList.toggle("selected",n.dataset.choice===choice));if(selected.status==="vote")document.getElementById("confirm").textContent="Cast demo vote"}});overlay.addEventListener("click",e=>{if(e.target===overlay)close()});document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});render();
</script></body></html>
