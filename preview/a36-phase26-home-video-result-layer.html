<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090909">
<title>FlamesChallenge — Phase 26</title>
<style>html,body{margin:0;background:#090909;color:white;font-family:system-ui}#loading{display:grid;place-items:center;min-height:100dvh;font-size:14px}</style></head>
<body><div id="loading" role="status">Opening FlamesChallenge…</div>
<script>
(async()=>{
 try{
  // Exact inherited source and media. No production writes or score changes.
  const r=await fetch('./a36-phase22-uncropped-fullscreen.html',{cache:'no-store'});
  if(!r.ok)throw Error('Phase 22 source unavailable: '+r.status);
  let html=await r.text();
  const open='\'<div class="hybrid-home fc19-home fc20-decision fc21-competition fc24-focus fc27-home">\'+';
  const close='\'<span class="fc19-arrow" aria-hidden="true">→</span></button></div>\'+';
  if(html.split(open).length!==2||html.split(close).length!==2)
   throw Error('Home source changed; cannot safely render this revision');
  html=html.replace(open,
   '\'<div class="hybrid-home fc19-home fc20-decision fc21-competition fc24-focus fc27-home fc23-home">\'+\n  \'<div class="fc23-featured">\'+');
  html=html.replace(close,
   '\'<span class="fc19-arrow" aria-hidden="true">→</span></button></div></div>\'+');
  html=html.replace('</head>','<style>'+"\n/* Phase 23: the Home performance occupies the full usable screen, not a 360px tile. */\n.fc19-home.fc23-home .fc23-featured{\n position:relative;isolation:isolate;overflow:hidden;\n height:max(380px,calc(100dvh - 141px - var(--safeTop) - var(--safeBottom)));\n background:#090808;\n}\n.fc19-home.fc23-home .fc23-featured .fc19-stage,\n.fc19-home.fc24-focus.fc27-home.fc23-home .fc23-featured .fc19-stage{\n position:absolute;inset:0;z-index:0;width:100%;margin:0!important;border:0!important;\n height:100%!important;min-height:0!important;max-height:none!important;background:#0b0a09;\n}\n.fc19-home.fc23-home .fc23-featured .fc19-stage > video[data-dance-preview]{\n width:100%!important;height:100%!important;object-fit:contain!important;\n object-position:center!important;background:transparent!important;\n}\n.fc19-home.fc23-home .fc23-featured .fc19-head{\n position:absolute;z-index:5;top:0;left:0;right:0;margin:0;\n padding:17px 16px 35px!important;pointer-events:none;\n background:linear-gradient(180deg,#080607fa 0%,#100c0ce6 65%,transparent 100%)!important;\n}\n.fc19-home.fc23-home .fc23-featured .fc19-head h1{\n font-size:clamp(25px,7vw,33px);text-shadow:0 2px 7px #000b;\n}\n.fc19-home.fc23-home .fc23-featured .fc19-head p{\n color:#eadbd1;font-size:12px;text-shadow:0 1px 5px #000b;\n}\n.fc19-home.fc23-home .fc23-featured .fc19-cta-row{\n position:absolute!important;z-index:6;bottom:0!important;left:0;right:0;margin:0!important;\n padding:22px 12px 12px!important;\n background:linear-gradient(0deg,#080607fc 0%,#140b0be4 55%,transparent 100%)!important;\n border:0!important;\n}\n.fc19-home.fc23-home .fc23-featured .fc19-watch{\n background:#281a14ee!important;border:1px solid #714531!important;\n border-radius:10px!important;min-height:55px!important;\n}\n.fc19-home.fc23-home .fc23-featured .hybrid-hit{z-index:2}\n.fc19-home.fc23-home .fc19-more{position:relative;z-index:1}\n/* Compete uses the same original entry, so never crop it there either. */\n#screen .fc10-feature .hybrid-stage video[data-dance-preview]{\n object-fit:contain!important;object-position:center!important;background:#0b0a09;\n}\n@media(max-width:355px){\n .fc19-home.fc23-home .fc23-featured .fc19-head{padding:12px 12px 28px!important}\n .fc19-home.fc23-home .fc23-featured .fc19-cta-row{padding:18px 9px 9px!important}\n}\n@media(max-height:470px) and (orientation:landscape){\n .fc19-home.fc23-home .fc23-featured{\n  height:max(240px,calc(100dvh - 141px - var(--safeTop) - var(--safeBottom)));\n }\n .fc19-home.fc23-home .fc23-featured .fc19-head{padding:8px 12px!important}\n .fc19-home.fc23-home .fc23-featured .fc19-head p{display:none}\n .fc19-home.fc23-home .fc23-featured .fc19-cta-row{padding:4px 12px!important}\n}"+'</style></head>');
  // Append isolated Home-video layout corrections AFTER Phase 23's styles.
  html=html.replace('</head>',"<style id=\"fc-phase25-home-video\">\n/* Phase 25 — Phase 14 composition with a genuinely large, flexible media stage.\n   Title and CTA are OUTSIDE the video. No change to any Phase 23 competition logic. */\n.fc19-home.fc23-home .fc23-featured {\n  display:flex!important;\n  flex-direction:column!important;\n  height:calc(100dvh - 180px - var(--safeTop) - var(--safeBottom))!important;\n  min-height:475px!important;\n  max-height:850px!important;\n  overflow:hidden!important;\n}\n.fc19-home.fc23-home .fc23-featured .fc19-head {\n  position:relative!important;\n  top:auto!important;left:auto!important;right:auto!important;\n  flex:0 0 auto!important;\n  padding:16px 16px 12px!important;\n  margin:0!important;\n  background:#0b0a0a!important;\n  pointer-events:auto!important;\n}\n.fc19-home.fc23-home .fc23-featured .fc19-stage,\n.fc19-home.fc24-focus.fc27-home.fc23-home .fc23-featured .fc19-stage {\n  position:relative!important;\n  inset:auto!important;\n  flex:1 1 0%!important;\n  width:100%!important;\n  height:auto!important;\n  min-height:0!important;\n  max-height:none!important;\n  margin:0!important;\n  border:0!important;\n  border-top:1px solid #261b16!important;\n  background:#0b0a09!important;\n}\n.fc19-home.fc23-home .fc23-featured .fc19-stage > video[data-dance-preview] {\n  width:100%!important;\n  height:100%!important;\n  object-fit:cover!important;\n  object-position:center 47%!important;\n}\n.fc19-home.fc23-home .fc23-featured .fc19-cta-row {\n  position:relative!important;\n  inset:auto!important;\n  flex:0 0 auto!important;\n  margin:0!important;\n  padding:9px 12px 11px!important;\n  background:#0e0b0a!important;\n  border:0!important;\n}\n.fc19-home.fc23-home .fc23-featured .fc19-watch {\n  min-height:53px!important;\n}\n@media(max-width:355px) {\n .fc19-home.fc23-home .fc23-featured .fc19-head {padding:12px 12px 10px!important}\n .fc19-home.fc23-home .fc23-featured .fc19-cta-row {padding:8px 10px 10px!important}\n}\n@media(max-height:470px) and (orientation:landscape) {\n .fc19-home.fc23-home .fc23-featured {\n  height:auto!important;min-height:0!important;max-height:none!important;\n }\n .fc19-home.fc23-home .fc23-featured .fc19-stage,\n .fc19-home.fc24-focus.fc27-home.fc23-home .fc23-featured .fc19-stage {\n  flex:none!important;height:min(56dvh,240px)!important;\n }\n}\n</style>"+'</head>');
  html=html.replace('</head>',"<style id=\"fc-phase26-result-layer\">\n/* A recorded-result sheet must be its own foreground. Only this sheet gets\n   an opaque scrim so the viewer's underlying X and controls never show through.\n   Close returns to the untouched Phase 23 viewer. */\n#overlay.show:has(.fc7-real-poster) {\n  background:#070607!important;\n}\n</style>"+'</head>');
  document.open();document.write(html);document.close();
 }catch(e){document.getElementById('loading').textContent='Preview unavailable: '+e.message;}
})();
</script></body></html>
