t-weight:900;letter-spacing:.07em;color:var(--text);background:var(--chip);border:1px solid var(--line);padding:7px 9px;border-radius:99px}.pill.live{color:var(--accent)}.hero{background:var(--surface);border:1px solid var(--line);border-radius:19px;overflow:hidden}.herohead{padding:14px 15px 12px}.herohead h2{font-size:26px;line-height:1.03;margin:11px 0 7px}.herohead p{font-size:12px;margin:0;line-height:1.4;color:var(--sub)}.hero-stage{position:relative;background:#1d1321;aspect-ratio:4/3;overflow:hidden}.art{display:block;width:100%;height:100%;object-fit:cover}.stagecap{position:absolute;inset:auto 0 0;padding:30px 16px 15px;background:linear-gradient(transparent,rgba(7,5,10,.91));color:white}.stagecap .who{font-size:22px;font-weight:950;letter-spacing:-.03em}.stagecap .name{font-size:12px;opacity:.86}.controlbar{padding:13px 15px 16px}.faces{display:flex;gap:6px;margin-bottom:13px}.face{border:2px solid transparent;min-height:45px;flex:1;background:var(--raised);border-radius:10px;display:grid;place-items:center;padding:5px 0;gap:2px;font-size:12px;font-weight:900}.face em{font-style:normal;font-size:10px;font-weight:700;color:var(--sub)}.face.selected{border-color:var(--accent)}.keyline{margin-top:17px;display:flex;align-items:center;justify-content:space-between}.keyline h2{margin:0}.listcard{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:13px;display:flex;align-items:center;gap:12px;width:100%;text-align:left}.miniart{width:88px;height:92px;flex:0 0 88px;background:#292530;border-radius:10px;overflow:hidden}.listcard .main{flex:1;min-width:0}.listcard h3{margin:9px 0 4px;font-size:16px}.listcard p{margin:0;color:var(--sub);font-size:12px}.listcard .go{font-size:23px;color:var(--accent)}.empty{padding:20px;border:1px dashed var(--line);border-radius:13px;color:var(--sub);font-size:13px;line-height:1.5}.bottom{position:fixed;z-index:8;bottom:0;left:0;right:0;background:var(--nav);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr)}.navitem{border:0;background:transparent;color:var(--navdim);min-height:46px;display:grid;justify-items:center;align-content:center;gap:2px;font-size:10px;font-weight:700}.navitem svg{height:21px;width:21px;stroke:currentColor;stroke-width:1.8;fill:none}.navitem.active{color:var(--accent)}.navitem.center .navicon{display:grid;place-items:center;background:var(--accent);color:var(--accent-text);border-radius:10px;width:33px;height:30px;font-weight:950;font-size:24px}.viewer{position:fixed;z-index:20;inset:0;background:var(--scrim);color:var(--text);display:flex;flex-direction:column;overflow:hidden}.viewerhead{flex:none;padding:calc(10px + env(safe-area-inset-top)) 13px 11px;display:flex;align-items:center;justify-content:space-between;gap:10px}.viewerhead div{min-width:0}.viewerhead strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.viewerhead small{font-size:11px;color:var(--sub)}.exit{background:var(--surface);border:1px solid var(--line);border-radius:99px;width:40px;height:40px;flex:0 0 40px;font-size:24px}.viewerstage{position:relative;flex:1;min-height:0;background:#101016;touch-action:pan-y}.viewerstage .art{height:100%}.viewerlabel{position:absolute;inset:auto 0 0;padding:55px 20px 16px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.9))}.viewerlabel strong{display:block;font-size:30px;font-weight:950;letter-spacing:-.04em}.viewerlabel span{font-size:13px}.arrows{position:absolute;top:42%;left:0;right:0;display:flex;justify-content:space-between;pointer-events:none;padding:0 6px}.arrows button{pointer-events:auto;border:1px solid #ffffff55;color:#fff;border-radius:50%;height:39px;width:39px;background:#0008;font-size:24px}.arrows button:disabled{opacity:.17}.viewerfoot{flex:none;padding:10px 13px calc(15px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}.votepick{border:1px @media(min-width:600px){.viewer{max-width:600px;left:50%;transform:translateX(-50%);box-shadow:0 0 0 100vmax #0009}.bottom{max-width:680px;left:50%;transform:translateX(-50%)}}
@media(max-height:690px){.viewerlabel strong{font-size:23px}.viewerfoot{padding-top:7px}.votepick{padding:7px;margin-bottom:5px}}

<body><div class="shell" id="shell"><header class="mast"><div class="brand"><b>♛</b> FLAMESCHALLENGE</div><button class="themebtn" id="themeBtn" aria-label="Switch appearance">Light mode ◐</button></header><main id="main" class="page" aria-live="polite"><p style="margin:32px 0;font-size:15px">Loading competition preview…</p><noscript>This interactive preview requires JavaScript. Open it in Safari with JavaScript enabled.</noscript></main></div><nav id="bottom" class="bottom" aria-label="Main navigation"></nav><div id="viewerMount"></div>
<script>
'use strict';
const players=[{id:'nyra',name:'Nyra',handle:'@NyraMoves',title:'The Drop',colors:['#b93d4a','#251e4b'],pose:0},{id:'kei',name:'Kei',handle:'@KeiSteps',title:'Precision',colors:['#ab5b28','#2f1f3f'],pose:1},{id:'sol',name:'Sol',handle:'@SolRitmo',title:'The Spin',colors:['#246e80','#1a254b'],pose:2},{id:'ava',name:'Ava',handle:'@AvaLines',title:'Zero Gravity',colors:['#8355a2','#221f4a'],pose:3},{id:'jax',name:'Jax',handle:'@JaxFlow',title:'Last Beat',colors:['#bc6949','#1b3645'],pose:4}];
const comps=[{id:'dance',title:'Street Dance Weekend',cat:'Dance',phase:'vote',sub:'Five performances. One decision.',description:'Watch all five sample routines. Choose the performance that deserves your practice vote.'},{id:'photo',title:'City After Rain',cat:'Photography',phase:'vote',sub:'Four photo entries',description:'Compare the light, timing and composition.'},{id:'music',title:'Unplugged Chorus',cat:'Music',phase:'enter',sub:'Entries open',description:'Submit an original chorus before voting begins.'},{id:'food',title:'The Sunday Plate',cat:'Cooking',phase:'done',sub:'Final result published',description:'See the sample winner and final placements.'},{id:'art',title:'Faces in Color',cat:'Art',phase:'upcoming',sub:'Opening soon',description:'Competition opens soon; no entry or vote is currently available.'}];
const captions={vote:'VOTING NOW',enter:'ACCEPTING ENTRIES',done:'RESULT SETTLED',upcoming:'UPCOMING'};const actions={vote:'Watch & compare',enter:'See entry details',done:'View results',upcoming:'See challenge details'};
const ST={tab:'Home',theme:'dark',mode:'arena',idx:0,vopen:false,ballot:false,pick:null,receipt:false,follow:false,viewPhase:'watch',challenge:'dance',sampleResult:false,youTab:'Votes',compact:false};
const $=id=>document.getElementById(id);const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function art(p,mini=false){const uid='u'+p.pose+(mini?'m':'f');let legs=[[28,-20],[35,20],[-50,18],[-15,25],[13,-45]][p.pose], arms=[[-55,70],[-50,48],[20,-65],[65,-22],[-75,5]][p.pose];return `<svg class="art" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Original illustration for demo performance ${esc(p.name)}"><defs><linearGradient id="${uid}g" x2="1" y2="1"><stop stop-color="${p.colors[0]}"/><stop offset="1" stop-color="${p.colors[1]}"/></linearGradient><linearGradient id="${uid}b" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><rect width="400" height="500" fill="url(#${uid}g)"/><path d="M-45 510L135 -20L270 -20L425 510Z" fill="url(#${uid}b)" opacity=".35"/><path d="M220 -20L95 500H320L315 -20Z" fill="#fff" opacity=".06"/><circle cx="320" cy="75" r="75" fill="#fff" opacity=".06"/><ellipse cx="198" cy="451" rx="141" ry="22" fill="#060610" opacity=".44"/><g transform="translate(205 247) rotate(${[ -9,18,24,-18,12][p.pose]})" stroke="#140f21" stroke-linecap="round" stroke-linejoin="round"><path d="M-17 15 Q-32 73 -5 122" stroke-width="55" fill="none"/><circle cx="-19" cy="-52" r="36" fill="#17121d" stroke="none"/><path d="M-4 90 Q${legs[0]} 145 76 181" stroke-width="26" fill="none"/><path d="M-5 91 Q${legs[1]} 157 -71 196" stroke-width="25" fill="none"/><path d="M-18 2 Q${arms[0]} -40 ${arms[1]} -107" stroke-width="24" fill="none"/><path d="M-18 9 Q${arms[1]} 55 93 ${arms[0]}" stroke-width="24" fill="none"/></g><g fill="none" stroke="#fff" opacity=".45"><circle cx="205" cy="226" r="159" stroke-width="1" stroke-dasharray="6 16"/><circle cx="205" cy="226" r="181" stroke-width="1" stroke-dasharray="1 25"/></g><text x="24" y="40" font-size="13" font-weight="900" letter-spacing="3" fill="#fff" opacity=".8">PERFORMANCE ${p.pose+1}</text></svg>`}
function categoryArt(c){
 const bg={photo:['#153c55','#357f8f'],music:['#291a50','#7b3674'],food:['#48321f','#b76f31'],art:['#74394b','#ce8856']}[c.id]||['#311b44','#8d4a63'];
 const scene={
 photo:`<circle cx="258" cy="63" r="37" fill="#e8deba" opacity=".88"/><path d="M0 154L34 154V95H68V127H96V78H138V161H170V59H219V130H256V92H300V250H0Z" fill="#102437"/><path d="M0 179L300 179M0 199L300 199M0 225L300 225" stroke="#b2ced8" opacity=".4" stroke-width="3"/><path d="M5 177L280 248M290 177L30 245" stroke="#d4f5e3" opacity=".22" stroke-width="4"/>`,
 music:`<circle cx="244" cy="60" r="59" fill="#ffffff" opacity=".07"/><path d="M52 141q50 -65 95 0t96 0" fill="none" stroke="#c5a6d7" stroke-width="6"/><path d="M70 116v52M88 101v83M106 93v97M125 114v60M218 105v86M238 118v61" stroke="#f9d6a6" opacity=".55" stroke-width="5" stroke-linecap="round"/><rect x="135" y="45" width="50" height="98" rx="25" fill="#21142c" stroke="#efb6ca" stroke-width="7"/><path d="M121 116a39 39 0 0 0 78 0M160 155v41m-35 0h70" fill="none" stroke="#efb6ca" stroke-width="7" stroke-linecap="round"/>`,
 food:`<circle cx="150" cy="143" r="103" fill="#edcf9e"/><circle cx="150" cy="143" r="83" fill="#faf0d9"/><circle cx="150" cy="143" r="67" fill="#c24b33"/><path d="M96 139q75-75 110 14t-114 5m21-34q64 5 68 65m-60-100q-40 50 45 97" fill="none" stroke="#e8bf78" stroke-width="14" stroke-linecap="round"/><g fill="#2d6745"><ellipse cx="174" cy="106" rx="18" ry="8" transform="rotate(-26 174 106)"/><ellipse cx="117" cy="175" rx="19" ry="8" transform="rotate(30 117 175)"/></g>`,
 art:`<rect x="63" y="27" width="176" height="205" rx="8" fill="#f2d9ae"/><path d="M87 198q50-110 109-81t22 90H87" fill="#7c4862"/><circle cx="156" cy="98" r="42" fill="#c38160"/><path d="M115 92q8-70 65-39 25 20 15 53-20-25-43-13-22-12-37-1" fill="#261b36"/><path d="M137 106h11m24 0h10" stroke="#472a31" stroke-width="5"/><path d="M154 131q18 9 29 0" fill="none" stroke="#512b2e" stroke-width="4"/><path d="M42 240l60-95" stroke="#271a27" stroke-width="10"/><path d="M95 152l15-20-8 28" fill="#d7ae54"/>`}[c.id]||'';
 return `<svg class="art" viewBox="0 0 300 250" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Original illustrated sample artwork for ${esc(c.cat)}"><defs><linearGradient id="cat${c.id}" x2="1" y2="1"><stop stop-color="${bg[0]}"/><stop offset="1" stop-color="${bg[1]}"/></linearGradient></defs><rect width="300" height="250" fill="url(#cat${c.id})"/>${scene}</svg>`
}
function navSvg(n){return {'Home':'<path d="M3 10l9-7 9 7v10h-6v-7H9v7H3z"/>','Compete':'<circle cx="12" cy="12" r="9"/><path d="M12 6v12M6 12h12"/>','Titles':'<path d="M4 18h16v3H4zM4 6l4 4 4-7 4 7 4-4-2 11H6z"/>','You':'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-8 16-8 16 0"/>'}[n]||''}
function nav(){const names=['Home','Compete','Create','Titles','You'];$('bottom').innerHTML=names.map(n=>`<button class="navitem ${ST.tab===n?'active':''} ${n==='Create'?'center':''}" data-nav="${n}" aria-label="${n}" ${ST.vopen?'disabled':''}>${n==='Create'?'<span class="navicon">+</span>':`<svg viewBox="0 0 24 24">${navSvg(n)}</svg>`}<span>${n}</span></button>`).join('')}
function stageCard(c,feature=false){const i=players[ST.idx],phase=c.phase;return `<article class="hero"><div class="herohead"><div class="row"><span class="pill ${phase==='vote'?'live':''}">${captions[phase]}</span><span class="count">${c.cat}${c.id==='dance'?' · 5 entries':''}</span></div><h2>${esc(c.title)}</h2><p>${esc(c.sub)}</p></div>${feature?`<div class="hero-stage">${art(i)}<div class="stagecap"><div class="who">${esc(i.handle)}</div><div class="name">Illustrated sample performance ${ST.idx+1} of 5</div></div></div>`:''}<div class="controlbar">${feature?`<div class="faces">${players.map((p,j)=>`<button class="face ${j===ST.idx?'selected':''}" data-slide="${j}" aria-label="Preview ${esc(p.handle)}"><span>${j+1}</span><em>${esc(p.name)}</em></button>`).join('')}</div>`:''}<button class="primary" data-open="${c.id}">${actions[phase]} →</button></div></article>`}
function listCard(c){const p=players[(comps.indexOf(c)+1)%5];return `<button class="listcard" data-open="${c.id}"><div class="miniart">${categoryArt(c)}</div><div class="main"><span class="eyebrow">${c.cat} · ${captions[c.phase]}</span><h3>${esc(c.title)}</h3><p>${esc(c.sub)}</p></div><span class="go">›</span></button>`}
function render(){document.documentElement.dataset.theme=ST.theme;document.body.classList.toggle('compact',ST.mode==='compact');$('themeBtn').textContent=ST.theme==='dark'?'Light mode ◐':'Dark mode ◑';nav();let t='';if(ST.tab==='Home'){t=`<div class="eyebrow">COMPETITION-FIRST PROTOTYPE</div><h1>Who should win?</h1><p class="topnote">INTERACTIVE SAMPLE · Illustrations and people are fictional. No live vote, ranking, or result is represented.</p><div class="row" style="margin-bottom:12px"><span class="prompt">Featured competition</span><span class="pill live">VOTING NOW</span></div>${stageCard(comps[0],true)}<div class="keyline"><h2>Different ways to compete</h2><button class="link" data-nav="Compete">See all →</button></div><div class="stack" style="margin-top:11px">${comps.slice(1).map(listCard).join('')}</div><div class="viewmode">Preview test: <button class="link" data-mode="${ST.mode==='arena'?'compact':'arena'}">${ST.mode==='arena'?'Compare compact alternative':'Return to immersive layout'}</button></div>`}
else if(ST.tab==='Compete'){t=`<div class="eyebrow">CHALLENGE DIRECTORY</div><h1>Find your competition.</h1><p class="topnote">The same competition, category, phase and viewer appear on Home and Compete.</p><div class="stack">${comps.map(listCard).join('')}</div>`}
else if(ST.tab==='You'){t=`<div class="eyebrow">YOUR COMPETITION STORY</div><h1>You</h1><div class="tabs"><button class="tab ${ST.youTab==='Votes'?'active':''}" data-youtab="Votes">Votes</button><button class="tab ${ST.youTab==='Following'?'active':''}" data-youtab="Following">Following</button></div>${ST.youTab==='Votes'?(ST.pick!==null?`<div class="receipt"><span class="pill">PRACTICE VOTE</span><h2 style="margin:12px 0 9px">Street Dance Weekend</h2><strong>You chose ${esc(players[ST.pick].handle)}</strong><p>${ST.sampleResult?'Practice result: '+esc(players[2].handle)+' is the fictional sample winner. This is not a settled database result.':'Voting open · Outcome pending. Your practice vote is saved only in this browser session.'}</p><button class="primary" data-open="dance">${ST.sampleResult?'Review sample result':'Return to competition'}</button><button class="secondary" style="width:100%;margin-top:8px" data-result="true">${ST.sampleResult?'Restore pending state':'Simulate a settled result (demo)'}</button></div>`:'<div class="empty">No practice votes yet. Choose a performance and submit a demo vote to see result tracking here.</div>'):(ST.follow?`<div class="receipt"><span class="pill">FOLLOWING · DEMO ONLY</span><h2 style="margin:12px 0">${esc(players[ST.pick].handle)}</h2><p>This is a sample following state. Following does not affect your vote or access to the competition result.</p><button class="primary" data-open="dance">See competitor and competition</button></div>`:'<div class="empty">You have not followed a demo competitor. Voting alone is enough to track the competition outcome.</div>')}<p class="fine" style="margin-top:16px">Demo only. No Supabase data or account information is read or written.</p>`}
else if(ST.tab==='Titles'){t=`<div class="eyebrow">COMPETITIVE RECOGNITION</div><h1>Titles</h1><div class="empty">Championships, qualification standings, and Hall of Fame will retain production's authoritative rules. This isolated prototype does not simulate Championship Score, qualification or awards.</div>`}
else{t=`<div class="eyebrow">CREATE</div><h1>Enter the arena.</h1><div class="empty">Production's upload, eligibility and submission process remains unchanged. This prototype does not accept or simulate entries.</div><button class="secondary" style="margin-top:14px" data-nav="Compete">Browse competitions →</button>`}
$('main').innerHTML=t; if(ST.vopen)renderViewer()}
function openChallenge(id){ST.challenge=id;ST.idx=0;ST.vopen=true;ST.ballot=false;ST.receipt=false;ST.viewPhase='watch';document.body.style.overflow='hidden';nav();renderViewer()}
function closeViewer(){ST.vopen=false;ST.ballot=false;ST.receipt=false;ST.viewPhase='watch';$('viewerMount').innerHTML='';document.body.style.overflow='';render()}
function showAt(i){ST.idx=Math.max(0,Math.min(players.length-1,i));if(ST.vopen)renderViewer();else render()}
function renderViewer(){if(!ST.vopen)return;const c=comps.find(x=>x.id===ST.challenge),p=players[ST.idx];let html=`<section class="viewer" role="dialog" aria-modal="true" aria-label="${esc(c.title)}"><header class="viewerhead"><button class="exit" data-close="true" aria-label="Close viewer">×</button><div><strong>${esc(c.title)}</strong><small>${c.cat} · ${captions[c.phase]} ${c.id==='dance'?'· '+(ST.idx+1)+' of 5':''}</small></div><span class="pill">SAMPLE</span></header>`;
if(c.id!=='dance'){html+=`<div style="padding:20px;overflow:auto;flex:1"><div class="eyebrow">${c.cat} · ${captions[c.phase]}</div><h1>${esc(c.title)}</h1><div class="notice">This is a labeled phase example. ${esc(c.description)}</div>${c.phase==='done'?'<div class="receipt">Settled winner and standings must come from the production database. No winner is fabricated here.</div>':c.phase==='vote'?'<div class="receipt">Four distinct eligible photo entries and a fair ballot must be supplied before this example can accept votes.</div>':c.phase==='enter'?'<div class="receipt">The existing entry form and upload controls must be used for actual submissions.</div>':'<div class="receipt">No action is available before the submission window opens.</div>'}</div><footer class="viewerfoot"><button class="primary" data-close="true">Back to challenges</button></footer>`}
else if(ST.receipt){html+=`<div style="padding:18px 15px;flex:1;overflow:auto"><div class="eyebrow">Practice ballot receipt</div><h1>Choice recorded.</h1><div class="receipt"><strong>${esc(players[ST.pick].handle)}</strong><p>Your choice is saved as a demo vote in this preview, not submitted to FlamesChallenge. You can check this competition in You → Votes without following anyone.</p></div><h2 style="margin-top:24px">Follow this competitor?</h2><p class="muted" style="font-size:13px">Optional. Following the creator is separate from tracking this result.</p><div class="split"><button class="secondary" data-follow="true">Follow ${esc(players[ST.pick].name)}</button><button class="secondary" data-follow="false">Not now</button></div><p id="followState" class="fine" style="margin:13px 0">${ST.follow?'Following this sample competitor.':'You can decide later.'}</p></div><footer class="viewerfoot"><button class="primary" data-goto-votes="true">View vote & pending result →</button></footer>`}
else if(ST.ballot){html+=`<div style="padding:15px;overflow:auto;flex:1"><button class="back" data-ballot-back="true">‹ Back to performances</button><div class="eyebrow">5 eligible sample entries</div><h1>Who earned your vote?</h1><p class="topnote">Compare all entries before choosing. This is a practice ballot only.</p><div class="choices">${players.map((x,j)=>`<button class="choice ${ST.pick===j?'selected':''}" data-pick="${j}"><span class="num">${j+1}</span><span><strong>${esc(x.name)}</strong><div class="tiny muted">${esc(x.handle)}</div></span></button>`).join('')}</div><p class="fine">No live standings or official winners are shown in this demonstration.</p></div><footer class="viewerfoot"><button class="primary" data-submit="true" ${ST.pick===null?'disabled':''}>Record practice vote</button></footer>`}
else{html+=`<div class="viewerstage" id="swipeZone">${art(p)}<div class="arrows"><button data-step="-1" aria-label="Previous competitor" ${ST.idx===0?'disabled':''}>‹</button><button data-step="1" aria-label="Next competitor" ${ST.idx===4?'disabled':''}>›</button></div><div class="viewerlabel"><strong>${esc(p.handle)}</strong><span>${esc(p.title)} · Illustrated sample, not video</span></div></div><footer class="viewerfoot"><div class="dots">${players.map((x,j)=>`<span class="dot ${j===ST.idx?'on':''}"></span>`).join('')}</div><div class="votepick"><div><strong>${ST.idx+1} of 5 competitors</strong><div class="tiny muted">Swipe left/right to compare this challenge</div></div><button class="secondary" data-ballot="true">Compare all</button></div><button class="primary" data-ballot="true">Choose your winner →</button></footer>`}
html+='</section>';$('viewerMount').innerHTML=html;let start=null;const area=$('swipeZone');if(area){area.addEventListener('touchstart',e=>{start={x:e.touches[0].clientX,y:e.touches[0].clientY}}, {passive:true});area.addEventListener('touchend',e=>{if(!start)return;let dx=e.changedTouches[0].clientX-start.x,dy=e.changedTouches[0].clientY-start.y;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.35)showAt(ST.idx+(dx<0?1:-1));start=null}, {passive:true})}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.nav){ST.tab=d.nav;ST.vopen=false;$('viewerMount').innerHTML='';render();window.scrollTo(0,0)}else if(d.slide!==undefined){showAt(Number(d.slide))}else if(d.open){openChallenge(d.open)}else if(d.close){closeViewer()}else if(d.step){showAt(ST.idx+Number(d.step))}else if(d.ballot){ST.ballot=true;renderViewer()}else if(d.ballotBack){ST.ballot=false;renderViewer()}else if(d.pick!==undefined){ST.pick=Number(d.pick);renderViewer()}else if(d.submit){if(ST.pick===null)return;ST.receipt=true;ST.ballot=false;renderViewer()}else if(d.follow!==undefined){ST.follow=d.follow==='true';renderViewer()}else if(d.gotoVotes){closeViewer();ST.tab='You';ST.youTab='Votes';render();window.scrollTo(0,0)}else if(d.youtab){ST.youTab=d.youtab;render()}else if(d.result){ST.sampleResult=!ST.sampleResult;render()}else if(d.mode){ST.mode=d.mode;render()}});
$('themeBtn').addEventListener('click',()=>{ST.theme=ST.theme==='dark'?'light':'dark';render()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ST.vopen)closeViewer();if(ST.vopen&&!ST.ballot&&!ST.receipt){if(e.key==='ArrowRight')showAt(ST.idx+1);if(e.key==='ArrowLeft')showAt(ST.idx-1)}});render();
</script></body></html>
