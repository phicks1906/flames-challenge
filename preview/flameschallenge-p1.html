/* True hidden means hidden even for flex or grid controls on iOS WebKit. */
[hidden]{display:none!important}
/* Mobile-first entry media selector, with a native input above the visible action. */
.entry-upload{display:grid;gap:10px;margin:14px 0 12px}
.entry-upload-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.upload-choice{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:93px;padding:12px 8px;gap:6px;border:1px dashed #9d6549;border-radius:14px;background:linear-gradient(160deg,#342216,#17120e);color:#fff;text-align:center;font-size:13px;font-weight:850;cursor:pointer;overflow:hidden}
.upload-choice .upload-glyph{font-size:23px;color:#ffb07b;line-height:1}
.upload-choice small{color:#b5a59a;font-size:10px;font-weight:650}
.upload-choice input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;z-index:2;cursor:pointer;font-size:120px}
.upload-choice:focus-within{outline:2px solid #ffaf73;outline-offset:2px}
.entry-selected{border:1px solid #79503b;border-radius:12px;background:#231b16;padding:10px;display:flex;gap:12px;align-items:center}
.entry-selected img{width:92px;height:105px;border-radius:8px;object-fit:cover;background:#171515}
.entry-selected strong{display:block;font-size:13px}
.entry-selected small{display:block;font-size:11px;color:#dfc8b6;overflow-wrap:anywhere}
.entry-selected p{margin:5px 0 0;font-size:11px;color:#a5d7a5}
.entry-status{font-size:12px;color:#c7b4a6;min-height:17px}
.entry-status.error{color:#ffad89}
.entry-form-help{font-size:11px;color:#a89a8f;line-height:1.45;margin:2px 0 11px}
.compete-feature{padding:0 12px}
.compete-feature .lead{margin:0}
.shortlist-note{margin:17px 12px 0;padding:12px 14px;border-radius:12px;border:1px solid #3d2f26;background:#1a1612;color:#c3b0a1;font-size:12px;line-height:1.4}
.empty-feature{margin:10px 12px 0;display:grid;grid-template-columns:108px 1fr;gap:15px;align-items:center;border:1px solid #53402f;border-radius:15px;padding:10px;background:#221914}
.empty-feature img{width:108px;height:146px;object-fit:cover;border-radius:10px}
.empty-feature h2{font-size:21px;line-height:1.05;letter-spacing:-.5px;margin:6px 0}
.empty-feature p{font-size:12px;color:#d1bdb0;margin-bottom:9px}
.empty-feature .button{width:100%;min-height:40px;padding:8px;font-size:12px}
.winner-feature{position:relative;margin:0 12px;border:1px solid #624e2d;border-radius:18px;overflow:hidden;background:#120e09}
.winner-feature img{width:100%;height:315px;object-fit:cover;display:block}
.winner-feature:after{content:"";position:absolute;inset:28% 0 0;background:linear-gradient(transparent,#090606ee);pointer-events:none}
.winner-feature .winner-copy{position:absolute;left:19px;right:19px;bottom:17px;z-index:2}
.winner-feature .winner-copy h2{font-size:29px;line-height:1.05;letter-spacing:-1px;margin:7px 0 8px}
.winner-feature .winner-copy p{font-size:12px;color:#ead3bb;margin:0 0 13px}
.winner-feature .winner-copy .button{width:100%}
.title-steps{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:13px}
.title-step{border:1px solid #4a3b29;background:#241b12;padding:12px 7px;border-radius:10px;text-align:center}
.title-step b{display:block;color:#efd29b;font-size:16px}
.title-step small{display:block;font-size:10px;color:#cebb9d;line-height:1.35;margin-top:3px}

/* Titles: show real competition mechanics and state instead of an unexplained trophy hero. */
.titles-tabs{margin-bottom:12px}
.titles-tabs button{font-size:12px;padding:9px 12px}
.title-hub{margin:0 12px 15px;padding:0 0 2px}
.title-hero{border:1px solid #57462b;border-radius:17px;background:radial-gradient(circle at 84% -12%,#4b3215 0%,#1d1712 62%,#100e0c 100%);padding:20px 18px 21px;position:relative;overflow:hidden}
.title-big-icon{float:right;font-family:Georgia,serif;color:#e7b76d;font-size:64px;line-height:1;margin:-3px 2px 0 7px;text-shadow:0 0 24px #8c5a254d}
.title-hero h2{font-size:27px;letter-spacing:-1px;line-height:1.08;margin:8px 0 9px}
.title-hero p{font-size:12px;color:#dfc9b1;margin:0;max-width:250px}
.title-road{margin:9px 0 0;display:grid;gap:7px}
.road-step{display:grid;grid-template-columns:41px 1fr;gap:11px;background:#181512;border:1px solid #393029;border-radius:12px;padding:13px}

 const kinds=mediaForCategory(c.category),primary=kinds[0];
 const prompt='Voting begins once the entry window closes.';
 const choices=kinds.map(kind=>`<div class="upload-media-kind"><div class="upload-kind-label">${kind==='audio'?'AUDIO ENTRY':kind==='video'?'VIDEO ENTRY':'PHOTO ENTRY'}</div><div class="entry-upload-actions ${kind==='audio'?'single':''}">${mediaPicker(kind)}</div></div>`).join('');
 openSheet(sheetHead(c.title)+`<div class="eyebrow">${escapeHTML(c.category.toUpperCase())} · ENTRIES OPEN</div><p class="sheettext">${escapeHTML(c.subtitle)} ${prompt}</p><form id="entryForm" novalidate><div class="field" style="margin-bottom:6px">Your original ${primary==='image'?'artwork':primary==='video'?'performance':'recording'}</div><div class="entry-upload">${choices}<div class="entry-selected" id="chosenEntryCard" hidden><div class="entry-media-preview" id="entryMediaPreview"></div><div><strong>Selected ${primary==='audio'?'media':'file'}</strong><small id="chosenEntryName"></small><p>Ready to submit</p></div></div><div class="entry-status" id="entryFileStatus" role="status">No ${primary==='audio'?'audio or video':primary==='video'?'video':'photo'} selected yet</div></div><label class="field">Caption<textarea id="workCaption" maxlength="200" placeholder="Tell us about your entry" required></textarea></label><p class="entry-form-help">Review your selected ${primary==='audio'?'recording or performance':uploadName(primary)} before submitting.</p><div class="sheetbottom">${btn('Cancel','closeSheet','button outline')}<button class="button hot fill" type="submit">Submit entry</button></div></form>`);
}
function submitEntry(){
 const file=entrySelection,kind=entryKind,c=find(entryChallengeId),caption=byId('workCaption')?.value?.trim(),status=byId('entryFileStatus');
 if(!c)return;
 if(!file){if(status){status.textContent=`Choose your ${mediaForCategory(c.category).map(uploadName).join(' or ')} first.`;status.classList.add('error')}return}
 if(!caption){byId('workCaption')?.focus();toast('Add a short caption for your work.');return}
 localEntries[c.id]={caption,fileName:file.name,kind,url:entryPreviewURL};entryPreviewURL=null;entrySelection=null;entryKind=null;
 closeSheet();toast('Entry submitted. Find it in Your Entries.');youTab='entries';nav('you');
}
function createForm(){openSheet(sheetHead('New challenge')+`<p class="sheettext">Set up a clear, fair challenge for other creators.</p><form id="createForm"><label class="field">Challenge name<input id="newChallengeTitle" minlength="4" maxlength="70" placeholder="e.g. The Perfect Portrait" required></label><label class="field">Category<select id="newChallengeCategory"><option>Photography</option><option>Art</option><option>Dance</option><option>Music</option><option>Cooking</option><option>Fitness</option><option>Sports</option><option>Style</option><option>Writing</option><option>Comedy</option></select></label><label class="field">What should competitors submit?<textarea id="newChallengeRule" minlength="10" placeholder="Describe a clear challenge…" required></textarea></label><div class="sheetbottom"><button type="submit" class="button hot full">Review challenge</button></div></form>`)}
function createReview(){const title=byId('newChallengeTitle')?.value?.trim(),cat=byId('newChallengeCategory')?.value,rule=byId('newChallengeRule')?.value?.trim();if(!title||rule.length<10)return;openSheet(sheetHead('Review your challenge')+`<div class="eyebrow">${escapeHTML(cat)}</div><h2 style="margin:4px 0">${escapeHTML(title)}</h2><p class="sheettext">${escapeHTML(rule)}</p><div class="follow-offer"><strong>Ready for the next step?</strong><p>This draft is available for review here. Publishing and moderation are handled by the full app.</p></div><div class="sheetbottom">${btn('Back to Create','closeSheet','button hot full')}</div>`)}
function notifications(){const ids=Object.keys(stored.votes);openSheet(sheetHead('Notifications')+(ids.length?ids.map(id=>{const c=find(id);return `<div class="panel" style="margin:0 0 8px"><strong>Your vote is recorded</strong><p style="margin:5px 0">${escapeHTML(c.title)} · ${c.phase==='finished'?'Result available':'Voting remains open'}</p>${btn('See competition','notification:'+id,'button compact hot')}</div>`}).join(''):`<div class="blank" style="margin:0"><h3>You're all caught up.</h3><p>Updates about votes, competitors and results will appear here.</p></div>`))}
function search(){openSheet(sheetHead('Find a challenge')+`<label class="field">Search challenges or categories<input id="searchTerm" placeholder="Dance, cooking, music…" autocomplete="off"></label><div id="searchResults" class="listwrap" style="padding:0"></div>`);byId('searchTerm').addEventListener('input',function(){const q=this.value.toLowerCase().trim();byId('searchResults').innerHTML=challenges.filter(c=>(c.title+' '+c.category+' '+c.subtitle).toLowerCase().includes(q)).map(rowCard).join('')||'<div class="blank" style="margin:0">No matching challenges.</div>'});byId('searchTerm').dispatchEvent(new Event('input'));byId('searchTerm').focus()}
function toast(msg){const n=byId('toast');n.textContent=msg;n.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.classList.remove('on'),2700)}
function dispatch(action){const [cmd,arg,more]=action.split(':');if(cmd==='nav')return nav(arg);if(cmd==='home'){homeTab=arg;return render()}if(cmd==='filter'){competeFilter=arg;current='compete';return render()}if(cmd==='you'){youTab=arg;return render()}if(cmd==='titles'){titlesSection=arg;return render()}if(cmd==='open'){closeSheet();return openChallenge(arg)}if(cmd==='closeSheet')return closeSheet();if(cmd==='ballot')return ballot(arg);if(cmd==='pick')return ballot(currentChallenge,Number(arg));if(cmd==='select')return select(arg,Number(more));if(cmd==='cast')return cast(arg);if(cmd==='receipt')return receipt(arg);if(cmd==='result')return result(arg);if(cmd==='standings')return standings(arg);if(cmd==='follow')return follow(arg);if(cmd==='followreceipt'){const c=find(arg);const vote=voteFor(c);if(vote===undefined)return;const handle=c.entries[vote].handle;if(!following(handle))stored.following.push(handle);save();return receipt(arg)}if(cmd==='decline')return decline(arg);if(cmd==='goVotes'){closeSheet();closeViewer();youTab='votes';return nav('you')}if(cmd==='explore'){closeSheet();closeViewer();return nav('compete')}if(cmd==='notification'){closeSheet();return openChallenge(arg)}if(cmd==='createForm')return createForm()}
loadDanceAssets();
document.addEventListener('click',e=>{const b=e.target.closest('button[data-act],button[data-nav],button[data-jump]');if(!b)return;if(b.dataset.nav)return nav(b.dataset.nav);if(b.dataset.jump!==undefined)return showEntryIndex(Number(b.dataset.jump));if(b.dataset.act)dispatch(b.dataset.act)});
byId('viewerClose').onclick=closeViewer;byId('prevEntry').onclick=()=>showEntryIndex(currentEntry-1);byId('nextEntry').onclick=()=>showEntryIndex(currentEntry+1);byId('mediaControl').onclick=mediaToggle;byId('searchButton').onclick=search;byId('bellButton').onclick=notifications;
byId('overlay').addEventListener('click',e=>{if(e.target===byId('overlay'))closeSheet()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(sheetOpen)closeSheet();else if(byId('viewer').classList.contains('show'))closeViewer()}if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&byId('viewer').classList.contains('show')&&!sheetOpen){showEntryIndex(currentEntry+(e.key==='ArrowRight'?1:-1))}});
let startX=null,startY=null;byId('stage').addEventListener('touchstart',e=>{if(e.target.closest('button'))return;const t=e.touches[0];startX=t.clientX;startY=t.clientY},{passive:true});byId('stage').addEventListener('touchend',e=>{if(startX===null)return;const t=e.changedTouches[0],dx=t.clientX-startX,dy=t.clientY-startY;startX=null;startY=null;if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy)*1.25){showEntryIndex(currentEntry+(dx<0?1:-1))}},{passive:true});
// Failed external media should not display broken-image icons over the competition stage.
document.addEventListener('error',e=>{if(e.target instanceof HTMLImageElement){e.target.style.opacity='0';e.target.alt='';}},true);
document.addEventListener('change',e=>{const kind=e.target?.dataset?.entryFile;if(kind)displayEntrySelection(e.target.files?.[0],kind)});
document.addEventListener('submit',e=>{if(e.target.id==='entryForm'){e.preventDefault();submitEntry()}if(e.target.id==='createForm'){e.preventDefault();createReview()}});
render();
</script>
</body>
</html>
